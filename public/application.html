<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>国内+韩国项目库｜韩学罗盘</title>
    <style>
      :root {
        --paper: #fbfbf8;
        --surface: #fffefb;
        --ink: #0a0a0a;
        --muted: #6d6a62;
        --panel: #f0eee6;
        --yellow: #ffe07a;
        --mint: #a4d4c5;
        --pink: #ffd0d8;
        --green: #71d39b;
        --peach: #ffb084;
        --lavender: #b8a4ed;
        --coral: #ff6b5a;
      }

      * { box-sizing: border-box; }

      html {
        overflow-y: scroll;
        scrollbar-gutter: stable;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family:
          "Microsoft YaHei UI", "Microsoft YaHei", "微软雅黑", "PingFang SC", "Noto Sans CJK SC",
          "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, "MS Gothic", "Malgun Gothic", Inter,
          system-ui, -apple-system, sans-serif;
      }

      a { color: inherit; text-decoration: none; }
      button, input { font: inherit; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .header {
        position: sticky;
        top: 0;
        z-index: 50;
        padding: 1rem 4rem;
        background: var(--paper);
        border-bottom: 1px solid var(--ink);
      }

      .header-inner {
        display: grid;
        min-height: 5rem;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 1rem;
      }

      .logo {
        display: block;
        width: 6.5rem;
        height: 5rem;
        object-fit: contain;
      }

      .header-title {
        min-width: 12rem;
        overflow: hidden;
        padding-left: 1rem;
        font-size: clamp(1.11rem, 1.92vw, 2.1rem);
        font-weight: 900;
        line-height: 1;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .nav {
        display: flex;
        max-width: min(72rem, calc(100vw - 11rem));
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        justify-content: flex-end;
      }

      .pill,
      .category-button,
      .source-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        color: var(--ink);
        font-weight: 800;
        line-height: 1;
        white-space: nowrap;
      }

      .pill {
        padding: 0.45rem 0.72rem;
        font-size: 0.95rem;
        background: #ffffff;
      }

      .pink { background: var(--pink); }
      .green { background: var(--green); }
      .yellow { background: var(--yellow); }
      .mint { background: var(--mint); }
      .peach { background: var(--peach); }

      .pill { background: #ffffff; }
      .pill.pink.active,
      .pill.pink:hover,
      .pill.pink:focus { background: var(--pink); }
      .pill.green.active,
      .pill.green:hover,
      .pill.green:focus { background: var(--green); }
      .pill.yellow.active,
      .pill.yellow:hover,
      .pill.yellow:focus { background: var(--yellow); }
      .pill.mint.active,
      .pill.mint:hover,
      .pill.mint:focus { background: var(--mint); }
      .pill.lavender.active,
      .pill.lavender:hover,
      .pill.lavender:focus { background: var(--lavender); }
      .pill.peach.active,
      .pill.peach:hover,
      .pill.peach:focus { background: var(--peach); }
      .nav-suffix { font-size: 0.85em; font-style: italic; font-weight: 400; }

      .wrap {
        width: calc(100% - 25rem);
        margin: 0 auto;
        padding: 1.05rem 0 5rem;
      }

      .page-head {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 1.4rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 5vw, 4.4rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0;
      }

      .lead {
        max-width: 56rem;
        margin: 0.9rem 0 0;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.7;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        border: 1px solid var(--ink);
        background: var(--surface);
      }

      .metric {
        min-width: 9rem;
        border-right: 1px solid var(--ink);
        padding: 0.78rem 1rem;
      }

      .metric:last-child { border-right: 0; }
      .metric span {
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 800;
      }
      .metric strong {
        display: block;
        margin-top: 0.42rem;
        font-size: 1.35rem;
        line-height: 1;
      }

      .project-audit-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0;
        border: 1px solid var(--ink);
        background: var(--surface);
      }

      .project-audit-strip > div {
        min-width: 0;
        border-right: 1px solid var(--ink);
        padding: 0.82rem 1rem;
      }

      .project-audit-strip > div:last-child { border-right: 0; }
      .project-audit-strip span {
        display: block;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 900;
      }
      .project-audit-strip strong {
        display: block;
        margin-top: 0.32rem;
        font-size: 1.25rem;
        line-height: 1;
      }
      .project-audit-strip p {
        margin: 0.38rem 0 0;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 700;
        line-height: 1.45;
      }

      .toolbox {
        display: grid;
        gap: 0.75rem;
        margin-top: 1.25rem;
      }

      .filter-top-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
        gap: 1rem;
      }

      .filter-bottom-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(12rem, 12.775rem);
        align-items: start;
        gap: 1rem;
      }

      .category-controls,
      .major-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }

      .mode-controls {
        justify-self: end;
      }

      .category-button {
        background: var(--panel);
        cursor: pointer;
        font-size: 0.82rem;
        padding: 0.52rem 0.88rem;
      }

      .category-button[aria-pressed="true"] {
        background: var(--yellow);
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      .mode-filter { background: #e6f7f7; }
      .major-filter { background: #f1f1ee; }
      .major-filter.major-art,
      .major-filter.major-media { background: var(--pink); }
      .major-filter.major-business { background: var(--yellow); }
      .major-filter.major-computer,
      .major-filter.major-engineering { background: var(--mint); }
      .major-filter.major-language { background: #d9cdf6; }
      .major-filter.major-tourism { background: var(--peach); }
      .major-filter.major-medical { background: #b7dbc6; }

      .search {
        width: 100%;
        height: 2.45rem;
        border: 0.7px solid var(--ink);
        border-radius: 6px;
        background: var(--surface);
        padding: 0 0.9rem;
        color: var(--ink);
        font-size: 0.82rem;
        font-style: italic;
        font-weight: 400;
        outline: none;
      }

      .search::placeholder {
        color: var(--muted);
        font-style: italic;
        font-weight: 400;
        opacity: 1;
      }
      .search:focus {
        border-color: var(--ink);
        box-shadow: 0 0 0 1px var(--ink);
      }

      .result-line {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 1.15rem;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 800;
      }

      table {
        width: 100%;
        margin-top: 1.632rem;
        border: 1px solid var(--ink);
        border-collapse: collapse;
        background: var(--surface);
        font-size: 0.84rem;
        table-layout: fixed;
      }

      th,
      td {
        border-bottom: 1px solid var(--ink);
        padding: 0.95rem 1rem;
        text-align: left;
        vertical-align: top;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      th {
        background: var(--panel);
        font-size: 0.93rem;
        font-weight: 900;
      }

      tbody tr:last-child td { border-bottom: 0; }

      tbody td[data-label="地区"] {
        font-size: 110.4%;
        font-weight: 400;
      }

      .school-toggle {
        display: block;
        width: 100%;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 900;
        line-height: 1.25;
        text-align: left;
        text-decoration: none;
      }

      .school-toggle:hover,
      .school-toggle[aria-expanded="true"] { color: inherit; }

      .school-toggle-arrow {
        display: inline-block;
        margin-left: 0.05em;
        font-size: 70%;
        font-weight: 400;
        line-height: 1;
        vertical-align: middle;
      }

      .partner-school-list {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.2rem;
        font-size: 110.4%;
        font-weight: 400;
        line-height: 1.55;
      }

      .partner-school-link,
      .partner-school-name {
        font-weight: 400;
      }

      .partner-school-link,
      .partner-school-name {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        column-gap: 0.45rem;
        row-gap: 0.18rem;
        color: inherit;
        font-family: inherit;
        font-size: inherit;
        font-style: inherit;
        line-height: 1.35;
      }

      .partner-school-link {
        border: 0;
        background: transparent;
        cursor: pointer;
        padding: 0;
        text-align: left;
        text-decoration: none;
      }

      .partner-school-link:hover,
      .partner-school-link[aria-expanded="true"] {
        color: inherit;
      }

      .partner-school-link:hover .partner-info-label,
      .partner-school-link:focus .partner-info-label,
      .partner-school-link[aria-expanded="true"] .partner-info-label {
        background: #e2f3cf;
      }

      .partner-school-link:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      .partner-tier {
        font-size: 85%;
        font-weight: 900;
      }

      .partner-info-label {
        display: inline-flex;
        min-height: 1.25rem;
        align-items: center;
        justify-content: center;
        border: 1px solid #a8aca2;
        background: #eef8df;
        color: var(--ink);
        padding: 0.12rem 0.72rem;
        font-size: 0.72rem;
        font-weight: 900;
        line-height: 1;
      }

      .school-subtitle {
        display: block;
        margin-top: 0.55rem;
        color: var(--muted);
        font-size: 0.76rem;
        line-height: 1.45;
      }

      .mode-badge,
      .tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        font-size: 0.74rem;
        font-weight: 900;
        line-height: 1;
      }

      .mode-badge {
        background: #e6f7f7;
        padding: 0.38rem 0.62rem;
      }

      .tag {
        margin: 0.12rem 0.16rem 0.12rem 0;
        padding: 0.32rem 0.52rem;
        background: #f1f1ee;
      }

      .tag.major-art,
      .tag.major-media { background: var(--pink); }
      .tag.major-business { background: var(--yellow); }
      .tag.major-computer,
      .tag.major-engineering { background: var(--mint); }
      .tag.major-language { background: #d9cdf6; }
      .tag.major-tourism { background: var(--peach); }
      .tag.major-medical { background: #b7dbc6; }

      .detail-row td {
        padding: 0;
        background: #f6f4ed;
      }

      .program-panel {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 0;
        border-top: 0;
      }

      .panel-block {
        border-right: 1px solid var(--ink);
        padding: 1.1rem;
      }

      .panel-block:last-child { border-right: 0; }

      .panel-block h2 {
        margin: 0 0 0.9rem;
        font-size: 1.02rem;
        line-height: 1.25;
      }

      .fact-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
      }

      .fact {
        border: 1px solid var(--ink);
        background: var(--surface);
        padding: 0.75rem;
      }

      .fact span {
        display: block;
        color: var(--ink);
        font-size: 0.792rem;
        font-weight: 900;
      }

      .fact p {
        margin: 0.48rem 0 0;
        font-size: 0.82rem;
        line-height: 1.55;
      }

      .source-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 0.9rem;
      }

      .source-link {
        background: var(--surface);
        padding: 0.34rem 0.56rem;
        font-size: 0.72rem;
      }

      .source-note {
        margin: 0.9rem 0 0;
        color: var(--muted);
        font-size: 0.78rem;
        font-style: italic;
        line-height: 1.6;
      }

      .school-profile {
        display: grid;
        grid-template-columns: minmax(12rem, 1.31fr) minmax(16rem, 1.35fr) minmax(20rem, 2.04fr);
        gap: 0.9rem;
        border: 1px solid var(--ink);
        background: var(--panel);
        padding: 0.95rem;
      }

      .profile-campus {
        display: grid;
        align-self: start;
        width: 100%;
        height: 22rem;
        min-height: 12rem;
        place-items: center;
        border: 1px solid var(--ink);
        background: #4a77c7;
        color: var(--surface);
        font-size: 1rem;
        font-weight: 900;
        letter-spacing: 0;
        overflow: hidden;
        text-align: center;
      }

      .profile-campus-image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .profile-facts,
      .profile-intro {
        border: 1px solid #aaa69d;
        background: var(--surface);
      }

      .profile-facts {
        display: grid;
        grid-template-rows: auto 1fr;
        align-self: start;
        height: 22rem;
        min-height: 22rem;
      }

      .profile-heading {
        border-bottom: 1px solid #aaa69d;
        background: #f1f1ee;
        padding: 0.62rem 0.8rem;
        text-align: center;
      }

      .profile-heading h2 {
        margin: 0;
        font-size: 0.92rem;
        line-height: 1.3;
      }

      .profile-heading small {
        display: block;
        margin-top: 0.18rem;
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 800;
      }

      .profile-info-grid {
        display: grid;
        grid-template-rows: repeat(6, minmax(0, 1fr));
        min-height: 0;
      }

      .profile-info-row {
        display: grid;
        grid-template-columns: 47% 53%;
        min-height: 0;
        border-bottom: 1px solid #aaa69d;
      }

      .profile-info-row:last-child { border-bottom: 0; }

      .profile-tier-row {
        border-bottom: 1px solid var(--ink);
      }

      .profile-info-row span,
      .profile-info-row strong {
        display: grid;
        align-items: center;
        padding: 0.55rem 0.8rem;
        font-size: 0.82rem;
        line-height: 1.35;
      }

      .profile-info-row span {
        border-right: 1px solid #aaa69d;
        font-weight: 800;
        text-align: center;
      }

      .profile-info-row strong {
        font-weight: 900;
        text-align: center;
      }

      .profile-info-row small {
        font-weight: 400;
      }

      .profile-logo-cell {
        display: grid;
        place-items: center;
        min-width: 0;
      }

      .profile-logo-link,
      .profile-website-link {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        color: var(--ink);
        text-decoration: none;
      }

      .profile-logo-image {
        display: block;
        width: auto;
        max-width: min(8.2rem, 84%);
        height: auto;
        max-height: 2.35rem;
        object-fit: contain;
      }

      .profile-website-link {
        font-size: 0.8rem;
        font-weight: 900;
      }

      .profile-website-pending {
        color: var(--muted);
        font-size: 0.74rem;
        font-weight: 800;
      }

      .profile-intro-body {
        display: grid;
        min-height: 9.85rem;
        align-content: center;
        gap: 0.72rem;
        padding: 1rem 1.1rem;
      }

      .profile-intro-body p {
        margin: 0;
        font-size: 0.86rem;
        line-height: 1.75;
      }

      .profile-note {
        color: var(--muted);
        font-size: 0.72rem !important;
        font-style: italic;
      }

      .case-panel {
        display: grid;
        gap: 1rem;
        border: 1px solid var(--ink);
        background: var(--panel);
        padding: 1rem;
      }

      .case-summary-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.75rem;
      }

      .case-field {
        display: grid;
        gap: 0.3rem;
        font-size: 0.85rem;
        font-weight: 800;
      }

      .case-field strong {
        display: grid;
        min-height: 2.35rem;
        align-items: center;
        border: 1px solid var(--ink);
        background: var(--paper);
        padding: 0.55rem 0.65rem;
        font-size: 0.85rem;
        line-height: 1.1;
      }

      .case-count-value {
        color: #9f1d1d;
      }

      .case-charts {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.75rem;
        align-items: start;
      }

      .case-chart,
      .case-snapshot {
        border: 1px solid var(--ink);
        background: var(--paper);
        padding: 0.85rem;
      }

      .case-chart-head,
      .case-bar-meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .case-chart h3 {
        margin: 0;
        font-size: 0.9rem;
      }

      .case-bars {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.825rem;
        margin-top: 0.75rem;
      }

      .case-bar-meta {
        font-size: 0.72rem;
      }

      .case-bar-meta strong {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .case-bar-meta span {
        flex-shrink: 0;
      }

      .case-bar-track {
        height: 0.65rem;
        overflow: hidden;
        border: 1px solid var(--ink);
        border-radius: 999px;
        background: var(--surface);
      }

      .case-bar-track span {
        display: block;
        height: 100%;
        border-radius: 999px;
      }

      .case-result-stack {
        display: flex;
        height: 2.25rem;
        overflow: hidden;
        border: 1px solid var(--ink);
        background: var(--surface);
      }

      .case-result-stack span {
        display: grid;
        place-items: center;
        font-size: 0.72rem;
        font-weight: 900;
      }

      .case-result-stack span + span {
        border-left: 1px solid var(--ink);
      }

      .case-snapshots {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.75rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .case-snapshot {
        display: grid;
        gap: 0.7rem;
      }

      .case-snapshot div {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .case-snapshot strong {
        font-size: 0.9rem;
      }

      .case-snapshot p {
        margin: 0;
        color: var(--ink);
        font-size: 0.78rem;
        line-height: 1.55;
      }

      .case-snapshot span {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 0.35rem 0.58rem;
        font-size: 0.72rem;
        font-weight: 900;
      }

      .case-admitted { background: var(--green); }
      .case-rejected { background: var(--pink); }
      .case-mixed { background: var(--yellow); }

      .case-panel-note {
        margin: 0;
        color: var(--muted);
        font-size: 0.78rem;
        font-style: italic;
        line-height: 1.6;
        text-align: right;
      }

      .empty {
        border: 1px solid var(--ink);
        border-top: 0;
        background: var(--surface);
        padding: 2rem;
        text-align: center;
        font-weight: 900;
      }

      @media (max-width: 1180px) {
        .wrap { width: calc(100% - 4rem); }
        .page-head { justify-content: stretch; }
        .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .metric:nth-child(2) { border-right: 0; }
      }

      /* Fixed desktop shortcut navigation */
      @media (min-width: 721px) {
        .header .header-inner {
          display: grid;
          grid-template-columns: 6.5rem minmax(0, 1fr) auto;
        }

        .nav {
          position: absolute;
          top: 2.3rem;
          right: 4rem;
          width: min(60rem, calc(100vw - 13rem));
          max-width: none;
          flex-wrap: nowrap;
          justify-content: flex-end;
          justify-self: end;
        }

        .nav > .pill {
          flex: 0 0 auto;
          height: 2.35rem;
          min-height: 0;
          padding: 0;
          white-space: nowrap;
        }

        .nav > .pill:nth-child(1) { width: 10.4rem; }

        }

        function renderAdmissionCase(admissionCase) {
          const tone = admissionCase.resultKey === "admitted" ? "case-admitted" : admissionCase.resultKey === "rejected" ? "case-rejected" : "case-mixed";
          return '<li class="case-snapshot"><div><span class="' + tone + '">' + htmlEscape(admissionCase.result) + '</span><span>' + htmlEscape(admissionCase.entryYear) + '</span><span>' + htmlEscape(admissionCase.topik) + '</span></div><strong>' + htmlEscape(admissionCase.major) + '</strong><p>' + htmlEscape(admissionCase.highSchoolType) + ' / ' + htmlEscape(admissionCase.gpa) + ' / ' + htmlEscape(compact(admissionCase.coreStrength, 48)) + '</p></li>';
        }

        function hasBrokenText(value) {
          return /\?{2,}/.test(String(value || ""));
        }

        function profileIntroFallback(name, city, founded, type, focus) {
          const unknownFounded = "资料待核对";
          const genericFocus = "合作项目相关专业";
          const foundedPhrase = founded === unknownFounded
            ? "成立时间以学校官方最新披露为准"
            : "成立时间为" + founded;
          const focusPhrase = focus === genericFocus
            ? "合作项目相关专业方向"
            : focus + "方向";
          return name + "位于" + city + "，" + foundedPhrase + "，是一所" + type + "院校。该校在本项目库中主要用于" + focusPhrase + "的匹配参考，建议结合项目模式、韩语要求、学费与所在城市生活成本一起判断是否适合申请。";
        }

        function schoolProfile(partner) {
          const name = partner.displayName || partner.name || "韩国大学";
          const city = partner.city || "韩国";
          const type = partner.type || (partner.known ? "韩国高校" : "资料待核对");
          const focus = partner.focus || "合作项目相关专业";
          const totalStudents = partner.totalStudents || "资料待核对";
          const foreignStudents = partner.foreignStudents || "资料待核对";
          const founded = partner.founded || "资料待核对";
          const fallbackIntro = profileIntroFallback(name, city, founded, type, focus);
          const intro = partner.intro && !hasBrokenText(partner.intro) ? partner.intro : fallbackIntro;
          return {
            name,
            nameKr: partner.nameKr || "",
            nameEn: partner.nameEn || "",
            city,
            type,
            tier: partner.tier || "T4",
            focus,
            totalStudents,
            foreignStudents,
            founded,
            intro,
            campusImage: partner.campusImage || "",
            imagePosition: partner.imagePosition || "center",
            officialUrl: partner.officialUrl || "",
            sourceUrl: partner.sourceUrl || "",
            logoImage: partner.logoImage || "",
          };
        }

        function renderUniversityPanel(partner) {
          const profile = schoolProfile(partner);
          const subtitle = [profile.nameKr, profile.nameEn].filter(Boolean).join(" · ");
          const campusMedia = profile.campusImage
            ? '<img class="profile-campus-image" src="' + htmlEscape(profile.campusImage) + '" alt="' + htmlEscape(profile.name) + '校园图片" loading="lazy" style="object-position:' + htmlEscape(profile.imagePosition) + '">'
            : '<span>校园图片待核对</span>';
          const officialTarget = profile.officialUrl || profile.sourceUrl || "";
          const officialLogo = profile.logoImage
            ? '<img class="profile-logo-image" src="' + htmlEscape(profile.logoImage) + '" alt="' + htmlEscape(profile.name) + '学校标志" loading="lazy">'
            : '<span class="profile-website-pending">官网待核对</span>';
          const officialCell = officialTarget
            ? '<a class="' + (profile.logoImage ? 'profile-logo-link' : 'profile-website-link') + '" href="' + htmlEscape(officialTarget) + '" target="_blank" rel="noopener">' + officialLogo + '</a>'
            : officialLogo;
          return '<section class="school-profile" aria-label="' + htmlEscape(profile.name) + '学校介绍">' +
            '<div class="profile-campus">' + campusMedia + '</div>' +
            '<div class="profile-facts">' +
            '<div class="profile-heading"><h2>' + htmlEscape(profile.name) + '</h2>' + (subtitle ? '<small>' + htmlEscape(subtitle) + '</small>' : '') + '</div>' +
            '<div class="profile-info-grid">' +
            '<div class="profile-info-row"><span>学校类型</span><strong>' + htmlEscape(profile.type) + '</strong></div>' +
            '<div class="profile-info-row"><span>地理位置</span><strong>' + htmlEscape(profile.city) + '</strong></div>' +
            '<div class="profile-info-row"><span>成立时间</span><strong>' + htmlEscape(profile.founded) + '</strong></div>' +
            '<div class="profile-info-row"><span>学生数</span><strong>' + htmlEscape(profile.totalStudents) + '<br><small>外国人 ' + htmlEscape(profile.foreignStudents) + '</small></strong></div>' +
            '<div class="profile-info-row profile-tier-row"><span>参考层级</span><strong>' + htmlEscape(profile.tier) + '</strong></div>' +
            '<div class="profile-info-row profile-logo-row"><span>学校官网</span><strong class="profile-logo-cell">' + officialCell + '</strong></div>' +
            '</div></div>' +
            '<div class="profile-intro">' +
            '<div class="profile-heading"><h2>' + htmlEscape(profile.name) + '介绍</h2></div>' +
            '<div class="profile-intro-body"><p>' + htmlEscape(profile.intro) + '</p><p><strong>重点方向：</strong>' + htmlEscape(profile.focus) + '</p><p class="profile-note">学校简介用于快速了解合作院校，申请判断仍需结合官方招生简章、项目合同和最新费用说明。</p></div>' +
            '</div>' +
            '</section>';
        }

        function renderRow(program) {
          const tr = document.createElement("tr");
          const partnerSearch = (program.koreaPartners || []).map((partner) => [partner.raw, partner.displayName, partner.displayLabel, partner.tier].join(" ")).join(" ");
          tr.className = "program-row";
          tr.dataset.slug = program.slug;
          tr.dataset.mode = program.mode;
          tr.dataset.region = program.region;
          tr.dataset.majors = program.majorTags.join(" ");
          tr.dataset.search = [program.chinaSchool, program.koreaSchools, partnerSearch, program.mode, program.region, program.section, program.majorTags.join(" "), Object.values(program.fields).join(" ")].join(" ").toLowerCase();
          tr.innerHTML =
            '<td data-label="中国学校"><button class="school-toggle" type="button" aria-expanded="false">' + htmlEscape(program.chinaSchool) + '<span class="school-toggle-arrow" aria-hidden="true">↗</span></button></td>' +
            '<td data-label="地区">' + htmlEscape(program.region) + '</td>' +
            '<td data-label="韩国合作学校">' + partnerMarkup(program.koreaPartners) + '</td>' +
            '<td data-label="模式"><span class="mode-badge">' + htmlEscape(program.mode) + '</span></td>' +
            '<td data-label="专业方向">' + tagMarkup(program.majorTags) + '</td>';
          return tr;
        }

        function renderPanel(program) {
          const partnerNames = (program.koreaPartners || [])
            .map((partner) => (partner.displayName || partner.raw || "韩国大学") + (partner.city ? " (" + partner.city + ")" : ""))
            .join(" ") || program.koreaSchools;
          const field = (name) => program.fields?.[name] || "";
          const sources = (program.sources || []).length
            ? '<div class="source-list">' + program.sources.map((source) => '<a class="source-link" href="' + htmlEscape(source.url) + '" target="_blank" rel="noreferrer">来源 ' + htmlEscape(source.id) + '</a>').join("") + '</div>'
            : '<div class="source-list"><span class="source-link">来源待补充</span></div>';
          const sourceNote = '<p class="source-note">费用为网络公开信息整理，仅供参考；具体收费标准、缴费时间及奖学金/减免规则，请以学校最新官方规定为准。</p>';
          return '<section class="program-panel" aria-label="' + htmlEscape(program.chinaSchool) + ' 项目详情">' +
            '<div class="panel-block"><h2>' + htmlEscape(program.chinaSchool) + ' → ' + htmlEscape(partnerNames) + '</h2>' +
            '<div class="fact-grid">' +
            '<div class="fact"><span>专业设置</span><p>' + htmlEscape(summarizeFact("专业设置", field("专业设置"))) + '</p></div>' +
            '<div class="fact"><span>培养模式</span><p>' + htmlEscape(summarizeFact("培养模式", program.modeTitle || program.mode)) + '</p></div>' +
            '<div class="fact"><span>国内费用</span><p>' + htmlEscape(summarizeFact("国内费用", field("国内费用"))) + '</p></div>' +
            '<div class="fact"><span>韩方费用</span><p>' + htmlEscape(summarizeFact("韩方费用", field("韩方费用"))) + '</p></div>' +
            '</div></div>' +
            '<div class="panel-block"><h2>申请与证书</h2>' +
            '<div class="fact-grid">' +
            '<div class="fact"><span>申请条件</span><p>' + htmlEscape(summarizeFact("申请条件", field("申请条件"))) + '</p></div>' +
            '<div class="fact"><span>证书说明</span><p>' + htmlEscape(summarizeFact("证书说明", field("证书说明"))) + '</p></div>' +
            '</div>' + sources + sourceNote + '</div>' +
            '</section>';
        }

        function clearDetail() {
          if (detailRow) detailRow.remove();
          detailRow = null;
          expandedSlug = null;
          tbody.querySelectorAll(".school-toggle").forEach((button) => button.setAttribute("aria-expanded", "false"));
          tbody.querySelectorAll(".partner-school-link").forEach((button) => button.setAttribute("aria-expanded", "false"));
        }

        function toggleDetail(row, program) {
          const key = "program:" + program.slug;
          if (expandedSlug === key) {
            clearDetail();
            return;
          }
          clearDetail();
          expandedSlug = key;
          row.querySelector(".school-toggle")?.setAttribute("aria-expanded", "true");
          detailRow = document.createElement("tr");
          detailRow.className = "detail-row";
          detailRow.innerHTML = '<td colspan="5">' + renderPanel(program) + '</td>';
          row.after(detailRow);
        }

        function togglePartnerDetail(row, partner, button) {
          const key = "partner:" + partner.slug + ":" + row.dataset.slug;
          if (expandedSlug === key) {
            clearDetail();
            return;
          }
          clearDetail();
          expandedSlug = key;
          button.setAttribute("aria-expanded", "true");
          detailRow = document.createElement("tr");
          detailRow.className = "detail-row";
          detailRow.innerHTML = '<td colspan="5">' + renderUniversityPanel(partner) + '</td>';
          row.after(detailRow);
        }

        function hasActiveFilters() {
          return activeFilters.regions.size > 0 || activeFilters.modes.size > 0 || activeFilters.majors.size > 0;
        }

        function matchesFilter(program) {
          if (!hasActiveFilters()) return true;
          if (activeFilters.regions.size > 0 && !activeFilters.regions.has(program.region)) return false;
          if (activeFilters.modes.size > 0 && !activeFilters.modes.has(program.mode)) return false;
          if (activeFilters.majors.size > 0) {
            const matchesMajor = program.majorTags.some((tag) => activeFilters.majors.has(tag));
            if (!matchesMajor) return false;
          }
          return true;
        }

        function updateFilterButtons() {
          buttons.forEach((button) => {
            const filter = button.dataset.filter || "all";
            const [kind, value] = filter.split(":");
            const isPressed =
              filter === "all"
                ? !hasActiveFilters()
                : (kind === "region" && activeFilters.regions.has(value)) ||
                  (kind === "mode" && activeFilters.modes.has(value)) ||
                  (kind === "major" && activeFilters.majors.has(value));
            button.setAttribute("aria-pressed", String(isPressed));
          });
        }

        function toggleFilter(filter) {
          if (filter === "all") {
            activeFilters.regions.clear();
            activeFilters.modes.clear();
            activeFilters.majors.clear();
            return;
          }
          const [kind, value] = filter.split(":");
          const target =
            kind === "region" ? activeFilters.regions : kind === "mode" ? activeFilters.modes : kind === "major" ? activeFilters.majors : null;
          if (!target) return;
          target.has(value) ? target.delete(value) : target.add(value);
        }

        function normalizeSearchText(value) {
          return String(value || "").trim().toLocaleLowerCase();
        }

        function matchesSearch(row) {
          const query = normalizeSearchText(searchInput?.value);
          if (!query) return true;
          return normalizeSearchText(row.dataset.search).includes(query);
        }

        const rows = programs.map((program) => {
          const row = renderRow(program);
          row.querySelector(".school-toggle").addEventListener("click", () => toggleDetail(row, program));
          row.querySelectorAll(".partner-school-link").forEach((button) => {
            button.addEventListener("click", () => {
              const partner = program.koreaPartners.find((item) => item.slug === button.dataset.schoolSlug) || {
                slug: button.dataset.schoolSlug,
                displayName: button.dataset.schoolName,
              };
              togglePartnerDetail(row, partner, button);
            });
          });
          tbody.appendChild(row);
          return { row, program };
        });

        function applyFilters() {
          clearDetail();
          updateFilterButtons();
          let visible = 0;
          for (const item of rows) {
            const show = matchesFilter(item.program) && matchesSearch(item.row);
            item.row.hidden = !show;
            if (show) visible += 1;
          }
          emptyState.hidden = visible !== 0;
        }

        buttons.forEach((button) => {
          button.addEventListener("click", () => {
            toggleFilter(button.dataset.filter || "all");
            applyFilters();
          });
        });

        searchInput?.addEventListener("input", applyFilters);

        applyFilters();
      })();
    </script>
    <script>
      (() => {
        const preview = document.getElementById("application-entry-preview");
        if (!preview) return;

        const previewImage = preview.querySelector("img");
        const previewContent = preview.querySelector(".application-entry-preview-content") || preview;
        const previewClose = preview.querySelector(".application-entry-preview-close");
        const previewSnoozeKey = "koreaUniversityLinkApplicationPreviewHiddenDate";
        const previewSnoozeDurationMs = 30 * 60 * 1000;
        const getSnoozeUntil = () => {
          try {
            return Number(localStorage.getItem(previewSnoozeKey) || 0);
          } catch (error) {
            return 0;
          }
        };
        const setSnoozeUntil = (value) => {
          try {
            if (value) {
              localStorage.setItem(previewSnoozeKey, String(value));
            } else {
              localStorage.removeItem(previewSnoozeKey);
            }
          } catch (error) {
            // Ignore storage failures in file:// or private browsing contexts.
          }
        };

        if (getSnoozeUntil() > Date.now()) {
          preview.hidden = true;
          return;
        }

        const snoozeLabel = document.createElement("label");
        const snoozeCheckbox = document.createElement("input");
        const snoozeText = document.createElement("span");
        snoozeLabel.className = "application-entry-preview-snooze";
        snoozeCheckbox.type = "checkbox";
        snoozeCheckbox.id = "application-entry-preview-snooze";
        snoozeText.textContent = "30分钟内不再显示";
        snoozeLabel.append(snoozeCheckbox, snoozeText);
        previewContent.appendChild(snoozeLabel);

        let previewScale = 1;
        let previewX = 0;
        let previewY = 0;
        let dragPointerId = null;
        let dragStartX = 0;
        let dragStartY = 0;
        let dragOriginX = 0;
        let dragOriginY = 0;

        const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
        const updatePreviewTransform = () => {
          preview.style.setProperty("--preview-scale", String(previewScale));
          preview.style.setProperty("--preview-x", `${previewX}px`);
          preview.style.setProperty("--preview-y", `${previewY}px`);
        };
        const resetPreviewTransform = () => {
          previewScale = 1;
          previewX = 0;
          previewY = 0;
          updatePreviewTransform();
        };
        const closePreview = () => {
          preview.hidden = true;
          preview.classList.remove("is-dragging");
          resetPreviewTransform();
          document.removeEventListener("keydown", handlePreviewKeydown);
        };
        function handlePreviewKeydown(event) {
          if (event.key === "Escape" && !preview.hidden) closePreview();
        }

        snoozeCheckbox.addEventListener("change", () => {
          setSnoozeUntil(snoozeCheckbox.checked ? Date.now() + previewSnoozeDurationMs : 0);
        });

        preview.addEventListener("click", (event) => {
          if (event.target === preview || event.target.closest(".application-entry-preview-close")) {
            closePreview();
          }
        });
        previewClose?.addEventListener("click", closePreview);

        previewImage?.addEventListener("wheel", (event) => {
          event.preventDefault();
          const zoomStep = event.deltaY < 0 ? 0.12 : -0.12;
          previewScale = clamp(Math.round((previewScale + zoomStep) * 100) / 100, 0.5, 3);
          updatePreviewTransform();
        }, { passive: false });

        previewImage?.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          dragPointerId = event.pointerId;
          dragStartX = event.clientX;
          dragStartY = event.clientY;
          dragOriginX = previewX;
          dragOriginY = previewY;
          preview.classList.add("is-dragging");
          previewImage.setPointerCapture(event.pointerId);
        });

        previewImage?.addEventListener("pointermove", (event) => {
          if (dragPointerId !== event.pointerId) return;
          previewX = dragOriginX + event.clientX - dragStartX;
          previewY = dragOriginY + event.clientY - dragStartY;
          updatePreviewTransform();
        });

        const stopDrag = (event) => {
          if (dragPointerId !== event.pointerId) return;
          dragPointerId = null;
          preview.classList.remove("is-dragging");
          if (previewImage.hasPointerCapture(event.pointerId)) {
            previewImage.releasePointerCapture(event.pointerId);
          }
        };
        previewImage?.addEventListener("pointerup", stopDrag);
        previewImage?.addEventListener("pointercancel", stopDrag);

        resetPreviewTransform();
        preview.hidden = false;
        document.body.classList.add("application-entry-preview-ready");
        document.addEventListener("keydown", handlePreviewKeydown);
      })();
    </script>
  </body>
</html>
