        --yellow: #ffe07a;

      * { box-sizing: border-box; }

        color: var(--ink);

      a { color: inherit; text-decoration: none; }

      .header {

        top: 0;
        z-index: 50;
        padding: 1rem 4rem;
        background: var(--paper);
        border-bottom: 1px solid var(--ink);
      }

      .header-inner {
        display: grid;
        min-height: 5rem;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 1rem;
      }

      .logo {
        display: block;
        width: 6.5rem;
        height: 5rem;
        object-fit: contain;
      }

      .header-title {
        min-width: 12rem;
        overflow: hidden;
        padding-left: 1rem;

        font-weight: 900;
        line-height: 1;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .nav {
        display: flex;
        max-width: min(72rem, calc(100vw - 11rem));
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        justify-content: flex-end;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 0.45rem 0.72rem;
        font-size: 0.95rem;
        font-weight: 800;
        line-height: 1;
        background: #ffffff;

      .yellow { background: var(--yellow); }
      .mint { background: var(--mint); }
      .pink { background: var(--pink); }
      .green { background: var(--green); }
      .peach { background: var(--peach); }

      .pill { background: #ffffff; }
      .pill.pink.active,
      .pill.pink:hover,
      .pill.pink:focus { background: var(--pink); }
      .pill.green.active,
      .pill.green:hover,
      .pill.green:focus { background: var(--green); }
      .pill.yellow.active,
      .pill.yellow:hover,
      .pill.yellow:focus { background: var(--yellow); }

      .pill.mint:hover,

      .nav-suffix { font-size: 0.85em; font-style: italic; font-weight: 400; }
