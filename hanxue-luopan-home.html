<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>韩学罗盘</title>
    <style>
      :root {
        --paper: #fbfbf8;
        --ink: #0a0a0a;
        --yellow: #ffe07a;
        --mint: #a4d4c5;
        --pink: #ffd0d8;
        --green: #71d39b;
        --lavender: #b8a4ed;
        --peach: #ffb084;
        --coral: #ff6b5a;
      }

      * {
        box-sizing: border-box;
      }

      html {
        overflow-y: scroll;
        scrollbar-gutter: stable;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family:
          "Microsoft YaHei UI", "Microsoft YaHei", "微软雅黑", "PingFang SC", "Noto Sans CJK SC",
          "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, "MS Gothic", "Malgun Gothic", Inter,
          system-ui, -apple-system, sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--paper);
        border-bottom: 1px solid var(--ink);
        padding: 1rem 4rem;
      }

      .header-inner {
        display: flex;
        min-height: 5rem;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .logo {
        display: block;
        width: 6.5rem;
        height: 5rem;
        object-fit: contain;
      }

      .top-nav {
        display: flex;
        max-width: min(72rem, calc(100vw - 11rem));
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 0.5rem;
      }

      .nav-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 0.5rem 1rem;
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1;
        background: #ffffff;
        transition: background-color 150ms ease;
      }

      .nav-shortcut {
        padding: 0.45rem 0.72rem;
        font-size: 0.95rem;
        font-weight: 800;
      }

      .nav-pill:hover,
      .nav-pill:focus,
      .nav-pill:active {
        background: var(--nav-pill-hover-bg, #ffffff);
        outline: none;
      }

      .nav-yellow {
        --nav-pill-hover-bg: var(--yellow);
      }

      .nav-mint {
        --nav-pill-hover-bg: var(--mint);
      }

      .nav-pink {
        --nav-pill-hover-bg: var(--pink);
      }

      .nav-green {
        --nav-pill-hover-bg: var(--green);
      }

      .nav-lavender {
        --nav-pill-hover-bg: var(--lavender);
      }

      .nav-peach {
        --nav-pill-hover-bg: var(--peach);
      }

      .mobile-home {
        display: none;
      }

      .mobile-home-card {
        display: grid;
        min-height: 6.1rem;
        align-content: space-between;
        border: 1px solid var(--ink);
        border-radius: 8px;
        background: #ffffff;
        padding: 0.75rem;
      }

      .mobile-home-card span:first-child {
        display: inline-flex;
        width: 2.25rem;
        height: 2.25rem;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 900;
      }

      .mobile-home-card strong {
        display: block;
        font-size: 0.98rem;
        line-height: 1.2;
      }

      .mobile-home-card small {
        display: block;
        margin-top: 0.25rem;
        color: #6a6a6a;
        font-size: 0.74rem;
        font-weight: 800;
      }

      .recommender {
        border-top: 1px solid var(--ink);
        border-bottom: 0;
        padding: 4.1rem 0 2rem;
      }

      .recommender-inner {
        display: block;
        width: calc(100% - 25rem);
        max-width: none;
        margin: 0 auto;
      }

      .recommender-kicker {
        display: inline-flex;
        border: 1px solid var(--ink);
        border-radius: 999px;
        background: var(--mint);
        padding: 0.35rem 0.7rem;
        font-size: 0.78rem;
        font-weight: 900;
      }

      .recommender-title {
        max-width: 14ch;
        margin: 0.75rem 0 0;
        font-size: clamp(2.25rem, 4.5vw, 4.5rem);
        font-weight: 900;
        line-height: 0.95;
        letter-spacing: 0;
      }

      .recommender-copy {
        max-width: 58ch;
        margin: 1rem 0 0;
        color: #6a6a6a;
        font-size: 1rem;
        line-height: 1.75;
      }

      .recommender-form {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        border: 1px solid var(--ink);
        background: #ffffff;
        padding: 1rem;
      }

      .recommender-form label {
        display: grid;
        gap: 0.3rem;
        font-size: 0.85rem;
        font-weight: 800;
      }

      .recommender-form input,
      .recommender-form select {
        width: 100%;
        border: 1px solid var(--ink);
        background: var(--paper);
        padding: 0.55rem 0.65rem;
        font: inherit;
      }

      .recommend-button {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        justify-content: center;
        margin-top: 0.9rem;
        border: 1px solid var(--ink);
        border-radius: 999px;
        background: var(--yellow);
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
        font-weight: 900;
        cursor: pointer;
      }

      .reset-button {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        background: var(--green);
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
        font-weight: 900;
        cursor: pointer;
      }

      .recommend-action-row {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        grid-column: 1 / -1;
        align-self: end;
        justify-self: end;
        width: min(58rem, 100%);
        margin-top: 0;
      }

      .recommend-action-row .recommend-button {
        margin-top: 0;
      }

      .recommend-action-row .recommender-note {
        align-self: flex-end;
        flex: 1;
        margin: 0 0.8rem 0.15rem 0;
      }

      .recommender-note {
        width: fit-content;
        max-width: min(42rem, 100%);
        margin: 0.9rem 0 0 auto;
        color: #6a6a6a;
        font-size: 0.78rem;
        font-style: italic;
        line-height: 1.6;
        text-align: right;
      }

      .recommendation-results {
        display: none;
        margin-top: 1.25rem;
      }

      .recommendation-results.is-visible {
        display: grid;
        gap: 0.75rem;
      }

      .recommendation-results h2 {
        margin: 0;
        font-size: 1.15rem;
        line-height: 1.2;
      }

      .recommendation-card {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        border: 1px solid var(--ink);
        background: #ffffff;
        padding: 0.9rem;
      }

      .recommendation-index {
        display: inline-flex;
        width: 1.6rem;
        height: 1.6rem;
        flex: 0 0 1.6rem;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--ink);
        color: #ffffff;
        font-size: 0.78rem;
        font-weight: 900;
        line-height: 1;
        margin-top: 0.05rem;
      }

      .recommendation-body {
        min-width: 0;
        flex: 1;
      }

      .recommendation-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
      }

      .recommendation-card h3 {
        margin: 0;
        font-size: 1rem;
      }

      .recommendation-school-toggle {
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        font-weight: 900;
        padding: 0;
        text-align: left;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.16em;
      }

      .recommendation-school-toggle:hover,
      .recommendation-school-toggle:focus,
      .recommendation-school-toggle[aria-expanded="true"] {
        text-decoration: underline;
      }

      .recommendation-school-toggle:focus-visible {
        outline: 2px solid #1ea7ff;
        outline-offset: 2px;
      }

      .recommendation-rank {
        margin-left: 0.35rem;
        color: var(--muted);
        font-size: 0.82em;
        font-style: italic;
        font-weight: 400;
      }

      .recommendation-meta-inline {
        margin-left: 1.1rem;
        color: var(--ink);
        font-size: 0.82em;
        font-weight: 700;
      }

      .recommendation-confidence {
        color: #9f1d1d;
        font-weight: 800;
      }

      .school-info-toggle {
        display: inline-flex;
        min-height: 1.25rem;
        align-items: center;
        justify-content: center;
        margin-left: 1.05rem;
        border: 1px solid #a8aca2;
        background: #eef8df;
        color: var(--ink);
        padding: 0.12rem 0.72rem;
        font: inherit;
        font-size: 0.72rem;
        font-weight: 900;
        line-height: 1;
        cursor: pointer;
      }

      .school-info-toggle:hover,
      .school-info-toggle:focus,
      .school-info-toggle[aria-expanded="true"] {
        background: #e2f3cf;
        outline: none;
      }

    .recommendation-card p {
      margin: 0.45rem 0 0;
      color: var(--ink);
      font-size: 0.78rem;
      line-height: 1.65;
    }

      .case-reason-detail {
        color: #123a72;
        letter-spacing: 0.025em;
        word-spacing: 0.16em;
        text-decoration: none;
      }

      .recommendation-card .recommendation-result-note {
        margin: -0.85rem 0 0;
        color: var(--muted);
        font-size: 0.72rem;
        font-style: italic;
        font-weight: 400;
        line-height: 1.55;
        text-align: right;
      }

      .school-info-panel {
        display: grid;
        grid-template-columns: minmax(12rem, 1fr) minmax(12rem, 1fr) minmax(18rem, 1.55fr);
        align-items: start;
        gap: 1rem;
        margin: 0.95rem 0 0;
        border: 1px solid var(--ink);
        background: var(--paper);
        container-type: inline-size;
        padding: 0.8rem;
      }

      .school-info-panel.is-no-photo {
        grid-template-columns: minmax(15rem, 1fr) minmax(18rem, 1.55fr);
      }

      .school-info-photo-frame {
        width: 100%;
        aspect-ratio: 1 / 1;
        align-self: start;
        overflow: hidden;
        border: 1px solid #a8a8a8;
        background: #f2f1ec;
        margin: 0;
      }

      .school-info-photo {
        display: block;
        height: 100%;
        object-fit: cover;
        width: 100%;
      }

      .school-info-table,
      .school-info-intro {
        height: calc((100cqw - 2rem) / 3.55);
        overflow: hidden;
        border: 1px solid #a8a8a8;
        background: var(--paper);
      }

      .school-info-table {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-rows: auto repeat(6, minmax(0, 1fr));
      }

      .school-info-table h4 {
        grid-column: 1 / -1;
        margin: 0;
        border-bottom: 1px solid #a8a8a8;
        background: #F1F1EE;
        padding: 0.62rem 0.7rem;
        text-align: center;
        font-size: 0.98rem;
        line-height: 1.35;
      }

      .school-info-table h4 small {
        display: block;
        margin-top: 0.15rem;
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 800;
      }

      .school-info-cell {
        display: grid;
        min-height: 0;
        place-items: center;
        border-bottom: 1px solid #a8a8a8;
        padding: 0.42rem 0.5rem;
        text-align: center;
        font-size: 0.8rem;
        font-weight: 900;
        line-height: 1.3;
      }

      .school-info-cell:nth-child(2n + 1) {
        border-left: 1px solid #a8a8a8;
      }

      .school-info-cell small {
        display: block;
        margin-top: 0.1rem;
        font-size: 0.68rem;
        font-style: italic;
        font-weight: 400;
      }

      .school-info-logo {
        display: block;
        width: min(6.3rem, 70%);
        height: 1.85rem;
        object-fit: contain;
      }

      .school-info-logo-cell {
        padding-block: 0.25rem;
      }

      .school-info-link {
        display: inline-grid;
        place-items: center;
        color: var(--ink);
        font-weight: 900;
        text-decoration: underline;
        text-underline-offset: 0.18em;
      }

      .school-info-logo-link {
        width: 100%;
        height: 100%;
        min-height: 0;
        text-decoration: none;
      }

      .school-info-intro {
        display: flex;
        flex-direction: column;
        padding: 0;
      }

      .school-info-intro h4 {
        margin: 0;
        border-bottom: 1px solid #a8a8a8;
        background: #F1F1EE;
        padding: 0.78rem 0.9rem;
        text-align: center;
        font-size: 0.98rem;
        line-height: 1.35;
      }

      .school-info-intro p {
        margin: 0.65rem 1.25rem 0;
        color: var(--ink);
        font-size: 0.86rem;
        line-height: 1.75;
      }

      .school-info-intro em {
        display: block;
        margin: auto 1.25rem 1.15rem;
        color: var(--muted);
        font-size: 0.72rem;
        font-style: italic;
        line-height: 1.65;
      }

      .school-info-panel + .recommendation-result-note {
        margin: 0.6rem 0 0;
      }

      .recommendation-case-panel {
        --case-panel-left-pull: 1rem;
        --case-panel-right-inset: 1.5rem;
        display: grid;
        width: calc(100% + var(--case-panel-left-pull) - var(--case-panel-right-inset));
        gap: 0.68rem;
        margin: 1rem var(--case-panel-right-inset) 0 calc(-1 * var(--case-panel-left-pull));
        border: 1px solid var(--ink);
        background: var(--paper);
        padding: 0.65rem;
        font-size: 0.88rem;
      }

      .recommendation-case-panel .recommendation-result-note {
        margin: 0;
        padding-top: 0.1rem;
        font-size: 0.68rem;
      }

      .case-field {
        display: grid;
        gap: 0.26rem;
        font-size: 0.78rem;
        font-weight: 800;
      }

      .case-field strong {
        display: grid;
        min-height: 2.1rem;
        align-items: center;
        border: 1px solid var(--ink);
        background: #ffffff;
        padding: 0.45rem 0.55rem;
        font-size: 0.78rem;
        font-weight: 900;
        line-height: 1.1;
      }

      .case-count-value {
        color: #9f1d1d;
      }

      .case-panel-note {
        margin: 0;
        color: var(--muted);
        font-size: 0.72rem;
        font-style: italic;
        line-height: 1.55;
        text-align: right;
      }

      .case-lens {
        display: grid;
        gap: 1rem;
        margin-top: 1.1rem;
        border: 1px solid var(--ink);
        background: #ffffff;
        padding: 1rem;
      }

      .case-lens-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        justify-content: flex-end;
      }

      .case-lens-badges span,
      .case-result-legend span,
      .case-snapshot span {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 0.31rem 0.52rem;
        font-size: 0.68rem;
        font-weight: 900;
      }

      .case-lens-badges span:first-child {
        background: var(--yellow);
      }

      .case-summary-row {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.65rem;
        align-items: stretch;
      }

      .case-lens-select {
        display: grid;
        gap: 0.3rem;
        font-size: 0.85rem;
        font-weight: 800;
      }

      .case-lens-select span {
        display: block;
      }

      .case-lens-select select {
        width: 100%;
        border: 2px solid #9f1d1d;
        background: var(--paper);
        padding: 0.55rem 0.65rem;
        font: inherit;
        font-weight: 900;
      }

      .case-jump-button {
        display: inline-flex;
        width: fit-content;
        margin-top: 0.65rem;
        border: 1px solid var(--ink);
        border-radius: 999px;
        background: var(--yellow);
        padding: 0.45rem 0.7rem;
        font-size: 0.72rem;
        font-weight: 900;
        cursor: pointer;
      }

      .case-metrics {
        display: grid;
        grid-column: span 3;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.75rem;
      }

      .case-chart,
      .case-snapshot {
        border: 1px solid var(--ink);
        background: var(--paper);
        padding: 0.68rem;
      }

      .case-metrics article {
        display: grid;
        gap: 0.3rem;
        align-content: start;
      }

      .case-metrics span {
        font-size: 0.85rem;
        font-weight: 800;
      }

      .case-metrics strong {
        display: grid;
        min-height: 2.35rem;
        align-items: center;
        border: 1px solid var(--ink);
        background: var(--paper);
        padding: 0.55rem 0.65rem;
        font-size: 0.85rem;
        line-height: 1.1;
      }

      .case-charts {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.65rem;
        align-items: stretch;
      }

      .case-chart-compact {
        min-height: 0;
      }

      .case-chart-head,
      .case-bar-meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .case-chart h3 {
        margin: 0;
        font-size: 0.82rem;
        line-height: 1.2;
      }

      .case-bars {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.45rem;
        margin-top: 0.58rem;
      }

      .case-bars-split {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.65rem;
      }

      .case-bar-meta {
        font-size: 0.66rem;
      }

      .case-bar-meta strong {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .case-bar-meta span {
        flex-shrink: 0;
        color: var(--muted);
      }

      .case-bar-track {
        height: 0.72rem;
        overflow: hidden;
        border: 1px solid var(--ink);
        border-radius: 999px;
        background: #ffffff;
      }

      .case-bar-track span {
        display: block;
        height: 100%;
        border-radius: 999px;
      }

      .case-result-stack {
        display: flex;
        height: 2.1rem;
        overflow: hidden;
        border: 1px solid var(--ink);
        border-radius: 0;
        background: #ffffff;
      }

      .case-result-stack span {
        display: grid;
        place-items: center;
        min-width: 0;
        border-left: 1px solid var(--ink);
        font-size: 0.66rem;
        font-weight: 900;
      }

      .case-result-stack span:first-child {
        border-left: 0;
      }

      .case-result-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 0.7rem;
      }

      .case-result-legend i {
        width: 0.55rem;
        height: 0.55rem;
        margin-right: 0.35rem;
        border: 1px solid var(--ink);
        border-radius: 999px;
      }

      .case-snapshots {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.6rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .case-snapshot {
        display: grid;
        gap: 0.45rem;
        background: #ffffff;
      }

      .case-snapshot div {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .case-snapshot strong {
        font-size: 0.8rem;
        line-height: 1.35;
      }

      .case-snapshot p {
        margin: 0;
        color: var(--muted);
        font-size: 0.76rem;
        line-height: 1.55;
      }

      .case-admitted {
        background: var(--green);
      }

      .case-rejected {
        background: var(--pink);
      }

      .case-mixed {
        background: var(--yellow);
      }

      .result-badge {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 0.28rem 0.6rem;
        color: var(--ink);
        font-size: 0.72rem;
        font-weight: 700;
        line-height: 1;
      }

      .recommender-form:not(.recommender-form-live),
      .recommend-button:not(#recommend-button) {
        display: none;
      }

      .recommender-inner > div:nth-child(3) {
        display: none;
      }

      .recommender-inner > div[aria-hidden="true"] {
        display: none;
      }

      /* Fixed desktop shortcut navigation */
      @media (min-width: 721px) {
        .site-header .header-inner,
        .header .header-inner {
          display: grid;
          grid-template-columns: 6.5rem minmax(0, 1fr) auto;
        }

        .top-nav,
        .nav {
          position: absolute;
          top: 2.3rem;
          right: 4rem;
          width: min(61.5rem, calc(100vw - 13rem));
          max-width: none;
          flex-wrap: nowrap;
          justify-content: flex-end;
        }

        .top-nav {
          grid-column: 3;
          justify-self: end;
        }

        .nav {
          justify-self: end;
        }

        .top-nav > .nav-pill,
        .nav > .pill {

            const logoImage = profile.logoImage;
            const officialWebsiteLabel = logoImage
              ? `<img class="school-info-logo" src="${htmlEscape(logoUrl(logoImage))}" alt="${htmlEscape(
                  profile.name
                )}校徽" />`
              : "官网";
            const officialWebsite = profile.officialWebsite
              ? `<a class="school-info-link${logoImage ? " school-info-logo-link" : ""}" href="${htmlEscape(
                  profile.officialWebsite
                )}" target="_blank" rel="noopener noreferrer">${officialWebsiteLabel}</a>`
              : `<span>资料待补</span>`;

            return `<section class="school-info-panel${profile.campusImage ? "" : " is-no-photo"}" aria-label="${htmlEscape(profile.name)}学校信息">${photo}<div class="school-info-table"><h4>${htmlEscape(
              profile.name
            )}${titleLine ? `<small>${htmlEscape(titleLine)}</small>` : ""}</h4><div class="school-info-cell">学校类型</div><div class="school-info-cell">${htmlEscape(
              profile.type
            )}</div><div class="school-info-cell">地理位置</div><div class="school-info-cell">${htmlEscape(
              profile.city
            )}</div><div class="school-info-cell">成立时间</div><div class="school-info-cell">${htmlEscape(
              profile.founded
            )}</div><div class="school-info-cell">学生数</div><div class="school-info-cell">${htmlEscape(profile.students)}${
              profile.internationalStudents ? `<small>${htmlEscape(profile.internationalStudents)}</small>` : ""
            }</div><div class="school-info-cell">参考层级</div><div class="school-info-cell">${htmlEscape(
              profile.tier
            )}</div><div class="school-info-cell">学校官网</div><div class="school-info-cell school-info-logo-cell">${officialWebsite}</div></div><div class="school-info-intro"><h4>${htmlEscape(
              profile.name
            )}介绍</h4><p>${htmlEscape(profile.intro)}</p><p><strong>重点方向：</strong>${htmlEscape(
              profile.focus
            )}</p><em>学校简介用于快速了解合作院校，申请判断仍需结合官方招生简章、项目合同和最新费用说明。</em></div></section>`;
          }

          function schoolTierRank(school) {
            return Number((tierNotes[school.slug] || "T4").replace("T", ""));
          }

          function isDefaultApplicant(applicant) {
            return (
              applicant.gpa === 77 &&
              applicant.schoolTier === "regular" &&
              applicant.topik === 4 &&
              applicant.gaokao === "not_submitted" &&
              applicant.major === "undecided" &&
              applicant.material === "matched" &&
              applicant.type === "any" &&
              applicant.region === "any"
            );
          }

          function scoreMajor(focus, major) {
            if (major === "undecided") return 18;
            return Math.min(30, (majorKeywords[major] || []).filter((keyword) => focus.includes(keyword)).length * 12);
          }

          function scoreLanguage(topik, minimum) {
            if (!minimum) return topik >= 3 ? 14 : 8;
            if (topik >= minimum + 2) return 20;
            if (topik >= minimum + 1) return 18;
            if (topik >= minimum) return 15;
            if (topik + 1 === minimum) return 8;
            return 3;
          }

          function readinessPenalty({ academicGateBlocked, languageGateBlocked, adjustedAcademicGap, languageGap }) {
            let penalty = 0;
            if (academicGateBlocked) penalty += 60;
            if (languageGateBlocked) penalty += 35;
            if (adjustedAcademicGap < -18) penalty += 35;
            else if (adjustedAcademicGap < -12) penalty += 22;
            else if (adjustedAcademicGap < -8) penalty += 12;
            if (languageGap <= -2) penalty += 30;
            else if (languageGap === -1) penalty += 12;
            return penalty;
          }

          function fitPriority({ academicGateBlocked, languageGateBlocked, adjustedAcademicGap, languageGap }) {
            if (academicGateBlocked || languageGateBlocked || adjustedAcademicGap < -18 || languageGap <= -2) return 2;
            if (adjustedAcademicGap < -8 || languageGap < 0) return 1;
            return 0;
          }

          function categoryForScore(score, fit) {
            if (fit === 2) return "先补条件";
            if (score >= 82) return "较有希望";
            if (score >= 68) return "适合申请";
            return "冲刺申请";
          }

          function caseReasonFor(school) {
            const detail = schoolDetails[school.slug];
            if (detail?.caseReason) return detail.caseReason;
            const summary = window.admissionCaseSummaries?.[school.slug];
            if (!summary?.representativeCases?.length) return "公开案例不足，建议只作为方向参考。";
            const gpa = summary.admittedAverageGpa ? `GPA ${Math.round(summary.admittedAverageGpa)}/100` : "GPA需个案核对";
            const topik = summary.topikDistribution?.[0]?.label || "TOPIK需个案核对";
            return `${Math.min(summary.caseCount || 1, 5)}个相近案例，常见约${gpa}、${topik}，路径需结合当年简章判断。`;
          }

          function detailsFor(school) {
            return (
              schoolDetails[school.slug] || {
                caseSummary: `${school.name}案例更适合作为申请画像参考，不能直接换算成录取概率。`,
                caution: "请以学校最新招生简章为准，重点核对语言、专业材料、面试和奖学金规则。"
              }
            );
          }

          function enrichSchool(school, applicant) {
            const tier = tierNotes[school.slug] || "T4";
            const target = tierTarget[tier] || 70;
            const topikMinimum = tierTopikMinimum[tier] || 3;
            const academicAdjusted =
              applicant.gpa - target + schoolTierBonus[applicant.schoolTier] + rankBonus[applicant.rank] + gaokaoBonus[applicant.gaokao];
            const academicScore = academicAdjusted >= 8 ? 20 : academicAdjusted >= 3 ? 17 : academicAdjusted >= 0 ? 14 : academicAdjusted >= -5 ? 9 : 4;
            const languageGap = applicant.topik - topikMinimum;
            const fit = fitPriority({
              academicGateBlocked: false,
              languageGateBlocked: languageGap < 0,
              adjustedAcademicGap: academicAdjusted,
              languageGap
            });
            const rawScore = scoreMajor(school.focus, applicant.major) + scoreLanguage(applicant.topik, topikMinimum) + academicScore + 15;
            const score = Math.max(0, rawScore - readinessPenalty({ academicGateBlocked: false, languageGateBlocked: languageGap < 0, adjustedAcademicGap: academicAdjusted, languageGap }));
            const detail = detailsFor(school);

            return {
              ...school,
              category: categoryForScore(score, fit),
              score,
              fit,
              academicAdjusted,
              caseReason: caseReasonFor(school),
              caseSummary: detail.caseSummary,
              caution: detail.caution,
              displayIndex: 0,
              visualOrder: 0
            };
          }

          function buildBalancedSlate(results) {
            const selected = [];
            const used = new Set();
            const slots = Object.entries(recommendationSlatePlan).flatMap(([category, plan]) =>
              Array.from({ length: plan.count }, () => category)
            );

            function pickFor(label) {
              const preferred = results.find((school) => !used.has(school.slug) && school.category === recommendationSlatePlan[label].label);
              return preferred || results.find((school) => !used.has(school.slug));
            }

            slots.forEach((label) => {
              const picked = pickFor(label);
              if (!picked) return;
              used.add(picked.slug);
              selected.push({ ...picked, category: recommendationSlatePlan[label].label });
            });

            return selected.slice(0, 7);
          }

          function recommendationResults(applicant) {
            if (isDefaultApplicant(applicant)) {
              return defaultSlate
                .map((slug) => universities.find((school) => school.slug === slug))
                .filter(Boolean)
                .map((school) => ({
                  ...enrichSchool(school, applicant),
                  category: defaultCategories[school.slug],
                  displayIndex: defaultVisualOrder[school.slug],
                  visualOrder: defaultVisualOrder[school.slug]
                }));
            }

            const filtered = universities
              .filter((school) => {
                if (applicant.type === "national") return school.type.includes("国立") || school.type.includes("公立");
                if (applicant.type === "private") return school.type.includes("私立");
                return true;
              })
              .filter((school) => {
                if (applicant.region === "seoul") return school.city.includes("首尔");
                if (applicant.region === "regional") return !school.city.includes("首尔");
                return true;
              })
              .map((school) => enrichSchool(school, applicant))
              .sort((a, b) => {
                const fitCompare = a.fit - b.fit;
                if (fitCompare !== 0) return fitCompare;
                return b.score - a.score || schoolTierRank(b) - schoolTierRank(a);
              });

            return buildBalancedSlate(filtered)
              .sort((a, b) => schoolTierRank(b) - schoolTierRank(a) || b.score - a.score)
              .slice(0, 7)
              .map((school, index) => ({ ...school, displayIndex: index + 1, visualOrder: index + 1 }));
          }

          function formatAverageGpa(value) {
            return value ? `${Math.round(value)}/100` : "样本不足";
          }

          function topSignal(items) {
            return items?.[0]?.label || "样本不足";
          }

          function formatPercent(value) {
            return `${Number(value || 0).toFixed(1).replace(/\.0$/, "")}%`;
          }

          function highlightItemKey(items) {
            return (items || []).reduce((best, item) => (!best || item.count > best.count ? item : best), null)?.key;
          }

          function miniChartLabel(title, text) {
            if (title === "TOPIK分布") return text.replace(/^TOPIK\s*/, "");
            if (title === "雅思分布") {
              const score = text.replace("雅思", "").trim();
              return /^\d+(?:\.\d+)?$/.test(score) ? `${score}分` : score.replace("雅思", "");
            }
            return text;
          }

          function resultStackColor(label) {
            if (label.includes("录取")) return "var(--yellow)";
            if (label.includes("拒绝")) return "#ffffff";
            return "var(--mint)";
          }

          function caseTone(resultKey) {
            if (resultKey === "admitted") return "case-admitted";
            if (resultKey === "rejected") return "case-rejected";
            return "case-mixed";
          }

          function compact(text, maxLength = 54) {
            const value = String(text || "");
            return value.length > maxLength ? `${value.slice(0, maxLength - 1)}…` : value;
          }

          function renderBars(title, items = []) {
            const highlightedKey = highlightItemKey(items);
            const caseHighlightColor = "var(--yellow)";
            const caseBarColor = "#d8d6cf";
            return `<section class="case-chart"><div class="case-chart-head"><h3>${htmlEscape(title)}</h3><span>↗</span></div><div class="case-bars">${(items || [])
              .slice(0, 6)
              .map((item) => {
                const width = Math.max(Number(item.percent) || 0, item.count > 0 ? 4 : 0);
                const color = item.key === highlightedKey ? caseHighlightColor : caseBarColor;
                return `<div class="case-bar-row"><div class="case-bar-meta"><strong>${htmlEscape(
                  miniChartLabel(title, item.label)
                )}</strong><span>${item.count} / ${formatPercent(item.percent)}</span></div><div class="case-bar-track"><span style="width:${width}%;background:${color}"></span></div></div>`;
              })
              .join("")}</div></section>`;
          }

          function renderResultStack(items = []) {
            return `<div class="case-field case-result-field"><span>申请结果</span><div class="case-result-stack">${items
              .map(
                (item) =>
                  `<span style="flex-basis:${item.percent}%;background:${resultStackColor(item.label)}">${
                    item.percent >= 12 ? `${htmlEscape(item.label)} ${item.count}` : ""
                  }</span>`
              )
              .join("")}</div></div>`;
          }

          function renderCase(caseItem) {
            return `<li class="case-snapshot"><div><span class="${caseTone(caseItem.resultKey)}">${htmlEscape(
              caseItem.result
            )}</span><span>${htmlEscape(caseItem.entryYear)}</span><span>${htmlEscape(
              caseItem.topik
            )}</span><span class="case-gpa">GPA ${htmlEscape(caseItem.gpa)}</span></div><strong>${htmlEscape(caseItem.major)}</strong><p>${htmlEscape(
              caseItem.highSchoolType
            )} / ${htmlEscape(compact(caseItem.coreStrength))}</p></li>`;
          }

          function renderRecommendationCasePanel(schoolSlug, schoolName) {
            const summary = window.admissionCaseSummaries?.[schoolSlug];
            if (!summary || summary.caseCount === 0) {
              return `<section class="recommendation-case-panel" aria-label="${htmlEscape(schoolName)}案例图表"><p>该校公开案例样本不足，建议先核对官方简章。</p></section>`;
            }

            return `<section class="recommendation-case-panel" aria-label="${htmlEscape(
              schoolName
            )}案例图表"><div class="case-summary-row"><div class="case-field"><span>样本量</span><strong class="case-count-value">${
              summary.caseCount
            }例</strong></div><div class="case-field"><span>录取人平均GPA</span><strong>${formatAverageGpa(
              summary.admittedAverageGpa
            )}</strong></div><div class="case-field"><span>TOPIK 主等级段</span><strong>${htmlEscape(
              topSignal(summary.topikDistribution)
            )}</strong></div>${renderResultStack(summary.resultDistribution)}</div><div class="case-charts">${renderBars("TOPIK分布", summary.topikDistribution)}${renderBars(
              "雅思分布",
              summary.ieltsDistribution
            )}${renderBars("高中背景", summary.highSchoolDistribution)}${renderBars("入学年份", summary.yearDistribution)}</div><ul class="case-snapshots">${(
              summary.representativeCases || []
            )
              .map(renderCase)
              .join("")}</ul><p class="recommendation-result-note">公开案例存在样本偏差，只适合做申请画像参考，不等于学校官方录取概率。</p></section>`;
          }

          let expandedRecommendationSlug = null;
          let expandedSchoolInfoSlug = null;

          function renderRecommendations(results) {
            return `<h2>AI案例推荐结果</h2>${results
              .map(
                (school) => `<article class="recommendation-card" style="order: ${school.visualOrder}">
                      <span class="recommendation-index" aria-label="推荐第${school.displayIndex}位">${school.displayIndex}</span>
                      <div class="recommendation-body">
                        <div class="recommendation-head">
                          <div>
                            <h3><button class="recommendation-school-toggle" type="button" data-school-slug="${school.slug}" aria-expanded="${expandedRecommendationSlug === school.slug ? "true" : "false"}">${htmlEscape(school.name)}</button><span class="recommendation-rank">${tierNotes[school.slug] || "T4"}</span><span class="recommendation-meta-inline">${school.city} / ${school.type} · <span class="recommendation-confidence">${school.category}</span></span><button class="school-info-toggle" type="button" data-school-info-slug="${school.slug}" aria-expanded="${expandedSchoolInfoSlug === school.slug ? "true" : "false"}">学校信息</button></h3>
                          </div>
                        </div>
                        <p><strong>专业方向匹配：</strong>${school.focus}</p>
                        <p><strong>案例参考：</strong><span class="case-reason-detail">${school.caseReason}</span></p>
                        <p>${htmlEscape(school.caseSummary)}</p>
                        <p>${htmlEscape(school.caution)}</p>
                        ${expandedSchoolInfoSlug === school.slug ? renderSchoolInfoPanel(school) : ""}
                        ${
                          expandedRecommendationSlug === school.slug
                            ? renderRecommendationCasePanel(school.slug, school.name)
                            : expandedSchoolInfoSlug === school.slug
                              ? ""
                              : '<p class="recommendation-result-note">公开案例存在样本偏差，只适合做申请画像参考，不等于学校官方录取概率。</p>'
                        }
                      </div>
                    </article>`
              )
              .join("")}`;
          }

          function recommend() {
            const applicant = {
              gpa: Number(value("rec-gpa")),
              schoolTier: value("rec-school-tier", "regular"),
              rank: value("rec-rank", "top_25"),
              gaokao: value("rec-gaokao"),
              topik: Number(value("rec-topik")),
              major: value("rec-major"),
              material: value("rec-material"),
              region: value("rec-region"),
              budget: value("rec-budget", "medium"),
              type: value("rec-type")
            };

            const target = document.getElementById("recommendation-results");
            target.classList.add("is-visible");
            target.dataset.lastApplicant = JSON.stringify(applicant);
            target.innerHTML = renderRecommendations(recommendationResults(applicant));
          }

          function toggleRecommendationCasePanel(schoolSlug) {
            const target = document.getElementById("recommendation-results");
            const applicant = JSON.parse(target.dataset.lastApplicant || "{}");
            const shouldOpen = expandedRecommendationSlug !== schoolSlug;
            expandedRecommendationSlug = shouldOpen ? schoolSlug : null;
            if (shouldOpen) expandedSchoolInfoSlug = null;
            target.innerHTML = renderRecommendations(recommendationResults(applicant));
          }

          function toggleSchoolInfoPanel(schoolSlug) {
            const target = document.getElementById("recommendation-results");
            const applicant = JSON.parse(target.dataset.lastApplicant || "{}");
            const shouldOpen = expandedSchoolInfoSlug !== schoolSlug;
            expandedSchoolInfoSlug = shouldOpen ? schoolSlug : null;
            if (shouldOpen) expandedRecommendationSlug = null;
            target.innerHTML = renderRecommendations(recommendationResults(applicant));
          }

          function resetRecommendation() {
            const defaults = {
              "rec-age": "18",
              "rec-gpa": "77",
              "rec-school-tier": "regular",
              "rec-rank": "top_25",
              "rec-topik": "4",
              "rec-english": "ielts60",
              "rec-gaokao": "not_submitted",
              "rec-major": "undecided",
              "rec-material": "matched",
              "rec-region": "any",
              "rec-budget": "medium",
              "rec-type": "any"
            };

            Object.entries(defaults).forEach(([id, defaultValue]) => {
              const field = document.getElementById(id);
              if (field) field.value = defaultValue;
            });

            const target = document.getElementById("recommendation-results");
            target.classList.remove("is-visible");
            delete target.dataset.lastApplicant;
            expandedRecommendationSlug = null;
            expandedSchoolInfoSlug = null;
            target.innerHTML = "";
          }

          document.getElementById("recommend-button").addEventListener("click", recommend);
          document.getElementById("reset-recommendation-button").addEventListener("click", resetRecommendation);
          document.getElementById("recommendation-results").addEventListener("click", (event) => {
            const schoolInfoButton = event.target.closest(".school-info-toggle");
            if (schoolInfoButton) {
              toggleSchoolInfoPanel(schoolInfoButton.dataset.schoolInfoSlug);
              return;
            }

            const button = event.target.closest(".recommendation-school-toggle");
            if (!button) return;
            toggleRecommendationCasePanel(button.dataset.schoolSlug);
          });
        })();
      </script>
    </main>
    <button class="back-to-top-button" type="button" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" aria-label="回到顶部">
      <img src="./public/up.gif" alt="" aria-hidden="true" />
    </button>
  </body>
