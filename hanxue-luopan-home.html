<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>韩国留学罗盘</title>
    <style>
      :root {
        --paper: #fbfbf8;
        --ink: #0a0a0a;
        --yellow: #ffe07a;
        --mint: #a4d4c5;
        --pink: #ffd0d8;
        --green: #71d39b;
        --lavender: #b8a4ed;
        --peach: #ffb084;
        --coral: #ff6b5a;
      }

      * {
        box-sizing: border-box;
      }

      html {
        overflow-y: scroll;
        scrollbar-gutter: stable;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family:
          "Microsoft YaHei UI", "Microsoft YaHei", "寰蒋闆呴粦", "PingFang SC", "Noto Sans CJK SC",
          "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, "MS Gothic", "Malgun Gothic", Inter,
          system-ui, -apple-system, sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--paper);
        border-bottom: 1px solid var(--ink);
        padding: 1rem 4rem;
      }

      .header-inner {
        display: flex;
        min-height: 5rem;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .logo {
        display: block;
        width: 6.5rem;
        height: 5rem;
        object-fit: contain;
      }

      .top-nav {
        display: flex;
        max-width: min(72rem, calc(100vw - 11rem));
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 0.5rem;
      }

      .nav-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 0.5rem 1rem;
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1;
        background: #ffffff;
        transition: background-color 150ms ease;
      }

      .nav-shortcut {
        padding: 0.45rem 0.72rem;
        font-size: 0.95rem;
        font-weight: 800;
      }

      .nav-pill:hover,
      .nav-pill:focus,
      .nav-pill:active {
        background: var(--nav-pill-hover-bg, #ffffff);
        outline: none;
      }

      .nav-yellow {
        --nav-pill-hover-bg: var(--yellow);
      }

      .nav-mint {
        --nav-pill-hover-bg: var(--mint);
      }

      .nav-pink {
        --nav-pill-hover-bg: var(--pink);
      }

      .nav-green {
        --nav-pill-hover-bg: var(--green);
      }

      .nav-lavender {
        --nav-pill-hover-bg: var(--lavender);
      }

      .nav-peach {
        --nav-pill-hover-bg: var(--peach);
      }

      .mobile-home {
        display: none;
      }

      .mobile-home-card {
        display: grid;
        min-height: 6.1rem;
        align-content: space-between;
        border: 1px solid var(--ink);
        border-radius: 8px;
        background: #ffffff;
        padding: 0.75rem;
      }

      .mobile-home-card span:first-child {
        display: inline-flex;
        width: 2.25rem;
        height: 2.25rem;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 900;
      }

      .mobile-home-card strong {
        display: block;
        font-size: 0.98rem;
        line-height: 1.2;
      }

      .mobile-home-card small {
        display: block;
        margin-top: 0.25rem;
        color: #6a6a6a;
        font-size: 0.74rem;
        font-weight: 800;
      }

      .recommender {
        border-top: 0;
        border-bottom: 0;
        padding: 1.23rem 0 1.4rem;
      }

      .recommender-inner {
        display: block;
        width: calc(100% - 25rem);
        max-width: none;
        margin: 0 auto;
      }

      .recommender-kicker {
        display: inline-flex;
        border: 1px solid var(--ink);
        border-radius: 999px;
        background: var(--mint);
        padding: 0.35rem 0.7rem;
        font-size: 0.78rem;
        font-weight: 900;
      }

      .recommender-title {
        max-width: 14ch;
        margin: 0.75rem 0 0;
        font-size: clamp(2.25rem, 4.5vw, 4.5rem);
        font-weight: 900;
        line-height: 0.95;
        letter-spacing: 0;
      }

      .recommender-copy {
        max-width: 58ch;
        margin: 1rem 0 0;
        color: #6a6a6a;
        font-size: 1rem;
        line-height: 1.75;
      }

      .recommender-form {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        border: 1px solid var(--ink);
        background: #ffffff;
        padding: 1rem;
      }

      .recommender-form label {
        display: grid;
        gap: 0.3rem;
        font-size: 0.85rem;
        font-weight: 800;
      }

      .recommender-form input,
      .recommender-form select {
        width: 100%;
        border: 1px solid var(--ink);
        background: var(--paper);
        padding: 0.55rem 0.65rem;
        font: inherit;
      }

      .recommend-button {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        justify-content: center;
        margin-top: 0.9rem;
        min-height: 2.18rem;
        border: 1px solid rgba(10, 10, 10, 0.34);
        border-radius: 8px;
        background: var(--yellow);
        color: var(--ink);
        padding: 0.45rem 1rem;
        font-size: 0.82rem;
        font-weight: 900;
        line-height: 1;
        box-shadow: inset 0 -2px 0 rgba(10, 10, 10, 0.08);
        cursor: pointer;
      }

      .reset-button {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        justify-content: center;
        min-height: 2.18rem;
        border: 1px solid rgba(10, 10, 10, 0.34);
        border-radius: 8px;
        background: var(--green);
        color: var(--ink);
        padding: 0.45rem 1rem;
        font-size: 0.82rem;
        font-weight: 900;
        line-height: 1;
        box-shadow: inset 0 -2px 0 rgba(10, 10, 10, 0.08);
        cursor: pointer;
      }

      .recommend-action-row {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        grid-column: 1 / -1;
        align-self: end;
        justify-self: end;
        width: min(58rem, 100%);
        margin-top: 0;
      }

      .recommend-action-row .recommend-button {
        margin-top: 0;
      }

      .recommend-action-row .recommender-note {
        align-self: flex-end;
        flex: 1;
        margin: 0 0.8rem 0.15rem 0;
      }

      .recommender-note {
        width: fit-content;
        max-width: min(42rem, 100%);
        margin: 0.9rem 0 0 auto;
        color: #6a6a6a;
        font-size: 0.78rem;
        font-style: italic;
        line-height: 1.6;
        text-align: right;
      }

      .recommendation-results {
        display: none;
        margin-top: 1.25rem;
      }

      .recommendation-results.is-visible {
        display: grid;
        gap: 0.75rem;
      }

      .recommendation-results h2 {
        margin: 0;
        font-size: 1.15rem;
        line-height: 1.2;
      }

      .recommendation-card {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        border: 1px solid var(--ink);
        background: #ffffff;
        padding: 0.9rem;
      }

      .recommendation-index {
        display: inline-flex;
        width: 1.6rem;
        height: 1.6rem;
        flex: 0 0 1.6rem;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--ink);
        color: #ffffff;
        font-size: 0.78rem;
        font-weight: 900;
        line-height: 1;
        margin-top: 0.05rem;
      }

      .recommendation-body {
        min-width: 0;
        flex: 1;
      }

      .recommendation-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
      }

      .recommendation-card h3 {
        margin: 0;
        font-size: 1rem;
      }

      .recommendation-school-toggle {
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        font-weight: 900;
        padding: 0;
        text-align: left;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.16em;
      }

      .recommendation-school-toggle:hover,
      .recommendation-school-toggle:focus,
      .recommendation-school-toggle[aria-expanded="true"] {
        text-decoration: underline;
      }

      .recommendation-school-toggle:focus-visible {
        outline: 2px solid #1ea7ff;
        outline-offset: 2px;
      }

      .recommendation-school-arrow {
        display: inline-block;
        font-size: 70%;
        line-height: 1;
        vertical-align: 0.12em;
      }

      .recommendation-rank {
        margin-left: 0.35rem;
        color: var(--muted);
        font-size: 0.82em;
        font-style: italic;
        font-weight: 400;
      }

      .recommendation-meta-inline {
        margin-left: 1.1rem;
        color: var(--ink);
        font-size: 0.82em;
        font-weight: 700;
      }

      .recommendation-confidence {
        color: #9f1d1d;
        font-weight: 800;
      }

      .school-info-toggle {
        display: inline-flex;
        min-height: 1.25rem;
        align-items: center;
        justify-content: center;
        margin-left: 1.05rem;
        border: 1px solid #a8aca2;
        background: #eef8df;
        color: var(--ink);
        padding: 0.12rem 0.72rem;
        font: inherit;
        font-size: 0.72rem;
        font-weight: 900;
        line-height: 1;
        cursor: pointer;
      }

      .school-info-toggle:hover,
      .school-info-toggle:focus,
      .school-info-toggle[aria-expanded="true"] {
        background: #e2f3cf;
        outline: none;
      }

    .recommendation-card p {
      margin: 0.45rem 0 0;
      color: var(--ink);
      font-size: 0.78rem;
      font-weight: 400;
      line-height: 1.65;
    }

      .recommendation-card p strong,
      .recommendation-card p span {
        font-weight: 400;
      }

      .case-reason-detail {
        color: #123a72;
        font-weight: 400;
        letter-spacing: 0.025em;
        word-spacing: 0.16em;
        text-decoration: none;
      }

      .recommendation-card .recommendation-result-note {
        margin: -0.85rem 0 0;
        color: var(--muted);
        font-size: 0.72rem;
        font-style: italic;
        font-weight: 400;
        line-height: 1.55;
        text-align: right;
      }

      .school-info-panel {
        display: grid;
        grid-template-columns: minmax(12rem, 1fr) minmax(12rem, 1fr) minmax(18rem, 1.55fr);
        align-items: start;
        gap: 1rem;
        margin: 0.95rem 0 0;
        border: 1px solid var(--ink);
        background: var(--paper);
        container-type: inline-size;
        padding: 0.8rem;
      }

      .school-info-panel.is-no-photo {
        grid-template-columns: minmax(15rem, 1fr) minmax(18rem, 1.55fr);
      }

      .school-info-photo-frame {
        width: 100%;
        aspect-ratio: 1 / 1;
        align-self: start;
        overflow: hidden;
        border: 1px solid #a8a8a8;
        background: #f2f1ec;
        margin: 0;
      }

      .school-info-photo {
        display: block;
        height: 100%;
        object-fit: cover;
        width: 100%;
      }

      .school-info-table,
      .school-info-intro {
        height: calc((100cqw - 2rem) / 3.55);
        overflow: hidden;
        border: 1px solid #a8a8a8;
        background: var(--paper);
      }

      .school-info-table {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-rows: auto repeat(6, minmax(0, 1fr));
      }

      .school-info-table h4 {
        grid-column: 1 / -1;
        margin: 0;
        border-bottom: 1px solid #a8a8a8;
        background: #F1F1EE;
        padding: 0.62rem 0.7rem;
        text-align: center;
        font-size: 0.98rem;
        line-height: 1.35;
      }

      .school-info-table h4 small {
        display: block;
        margin-top: 0.15rem;
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 800;
      }

      .school-info-cell {
        display: grid;
        min-height: 0;
        place-items: center;
        border-bottom: 1px solid #a8a8a8;
        padding: 0.42rem 0.5rem;
        text-align: center;
        font-size: 0.8rem;
        font-weight: 900;
        line-height: 1.3;
      }

      .school-info-cell:nth-child(2n + 1) {
        border-left: 1px solid #a8a8a8;
      }

      .school-info-cell small {
        display: block;
        margin-top: 0.1rem;
        font-size: 0.68rem;
        font-style: italic;
        font-weight: 400;
      }

      .school-info-logo {
        display: block;
        width: min(6.3rem, 70%);
        height: 1.85rem;
        object-fit: contain;
      }

      .school-info-logo-cell {
        padding-block: 0.25rem;
      }

      .school-info-link {
        display: inline-grid;
        place-items: center;
        color: var(--ink);
        font-weight: 900;
        text-decoration: underline;
        text-underline-offset: 0.18em;
      }

      .school-info-logo-link {
        width: 100%;
        height: 100%;
        min-height: 0;
        text-decoration: none;
      }

      .school-info-intro {
        display: flex;
        flex-direction: column;
        padding: 0;
      }

      .school-info-intro h4 {
        margin: 0;
        border-bottom: 1px solid #a8a8a8;
        background: #F1F1EE;
        padding: 0.78rem 0.9rem;
        text-align: center;
        font-size: 0.98rem;
        line-height: 1.35;
      }

      .school-info-intro p {
        margin: 0.65rem 1.25rem 0;
        color: var(--ink);
        font-size: 0.86rem;
        line-height: 1.75;
      }

      .school-info-intro em {
        display: block;
        margin: auto 1.25rem 1.15rem;
        color: var(--muted);
        font-size: 0.72rem;
        font-style: italic;
        line-height: 1.65;
      }

      .school-info-panel + .recommendation-result-note {
        margin: 0.6rem 0 0;
      }

      .recommendation-case-panel {
        --case-panel-left-pull: 1rem;
        --case-panel-right-inset: 1.5rem;
        display: grid;
        width: calc(100% + var(--case-panel-left-pull) - var(--case-panel-right-inset));
        gap: 0.68rem;
        margin: 1rem var(--case-panel-right-inset) 0 calc(-1 * var(--case-panel-left-pull));
        border: 1px solid var(--ink);
        background: var(--paper);
        padding: 0.65rem;
        font-size: 0.88rem;
      }

      .recommendation-case-panel .recommendation-result-note {
        margin: 0;
        padding-top: 0.1rem;
        font-size: 0.68rem;
      }

      .case-field {
        display: grid;
        gap: 0.26rem;
        font-size: 0.78rem;
        font-weight: 800;
      }

      .case-field strong {
        display: grid;
        min-height: 2.1rem;
        align-items: center;
        border: 1px solid var(--ink);
        background: #ffffff;
        padding: 0.45rem 0.55rem;
        font-size: 0.78rem;
        font-weight: 900;
        line-height: 1.1;
      }

      .case-count-value {
        color: #9f1d1d;
      }

      .case-panel-note {
        margin: 0;
        color: var(--muted);
        font-size: 0.72rem;
        font-style: italic;
        line-height: 1.55;
        text-align: right;
      }

      .case-lens {
        display: grid;
        gap: 1rem;
        margin-top: 1.1rem;
        border: 1px solid var(--ink);
        background: #ffffff;
        padding: 1rem;
      }

      .case-lens-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        justify-content: flex-end;
      }

      .case-lens-badges span,
      .case-result-legend span,
      .case-snapshot span {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 0.31rem 0.52rem;
        font-size: 0.68rem;
        font-weight: 900;
      }

      .case-lens-badges span:first-child {
        background: var(--yellow);
      }

      .case-summary-row {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.65rem;
        align-items: stretch;
      }

      .case-lens-select {
        display: grid;
        gap: 0.3rem;
        font-size: 0.85rem;
        font-weight: 800;
      }

      .case-lens-select span {
        display: block;
      }

      .case-lens-select select {
        width: 100%;
        border: 2px solid #9f1d1d;
        background: var(--paper);
        padding: 0.55rem 0.65rem;
        font: inherit;
        font-weight: 900;
      }

      .case-jump-button {
        display: inline-flex;
        width: fit-content;
        margin-top: 0.65rem;
        border: 1px solid var(--ink);
        border-radius: 999px;
        background: var(--yellow);
        padding: 0.45rem 0.7rem;
        font-size: 0.72rem;
        font-weight: 900;
        cursor: pointer;
      }

      .case-metrics {
        display: grid;
        grid-column: span 3;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.75rem;
      }

      .case-chart,
      .case-snapshot {
        border: 1px solid var(--ink);
        background: var(--paper);
        padding: 0.68rem;
      }

      .case-metrics article {
        display: grid;
        gap: 0.3rem;
        align-content: start;
      }

      .case-metrics span {
        font-size: 0.85rem;
        font-weight: 800;
      }

      .case-metrics strong {
        display: grid;
        min-height: 2.35rem;
        align-items: center;
        border: 1px solid var(--ink);
        background: var(--paper);
        padding: 0.55rem 0.65rem;
        font-size: 0.85rem;
        line-height: 1.1;
      }

      .case-charts {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.65rem;
        align-items: stretch;
      }

      .case-chart-compact {
        min-height: 0;
      }

      .case-chart-head,
      .case-bar-meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .case-chart h3 {
        margin: 0;
        font-size: 0.82rem;
        line-height: 1.2;
      }

      .case-bars {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.45rem;
        margin-top: 0.58rem;
      }

      .case-bars-split {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.65rem;
      }

      .case-bar-meta {
        font-size: 0.66rem;
      }

      .case-bar-meta strong {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .case-bar-meta span {
        flex-shrink: 0;
        color: var(--muted);
      }

      .case-bar-track {
        height: 0.72rem;
        overflow: hidden;
        border: 1px solid var(--ink);
        border-radius: 999px;
        background: #ffffff;
      }

      .case-bar-track span {
        display: block;
        height: 100%;
        border-radius: 999px;
      }

      .case-result-stack {
        display: flex;
        height: 2.1rem;
        overflow: hidden;
        border: 1px solid var(--ink);
        border-radius: 0;
        background: #ffffff;
      }

      .case-result-stack span {
        display: grid;
        place-items: center;
        min-width: 0;
        border-left: 1px solid var(--ink);
        font-size: 0.66rem;
        font-weight: 900;
      }

      .case-result-stack span:first-child {
        border-left: 0;
      }

      .case-result-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 0.7rem;
      }

      .case-result-legend i {
        width: 0.55rem;
        height: 0.55rem;
        margin-right: 0.35rem;
        border: 1px solid var(--ink);
        border-radius: 999px;
      }

      .case-snapshots {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.6rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .case-snapshot {
        display: grid;
        gap: 0.45rem;
        background: #ffffff;
      }

      .case-snapshot div {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .case-snapshot strong {
        font-size: 0.8rem;
        line-height: 1.35;
      }

      .case-snapshot p {
        margin: 0;
        color: var(--muted);
        font-size: 0.76rem;
        line-height: 1.55;
      }

      .case-admitted {
        background: var(--green);
      }

      .case-rejected {
        background: var(--pink);
      }

      .case-mixed {
        background: var(--yellow);
      }

      .result-badge {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 0.28rem 0.6rem;
        color: var(--ink);
        font-size: 0.72rem;
        font-weight: 700;
        line-height: 1;
      }

      .recommender-form:not(.recommender-form-live),
      .recommend-button:not(#recommend-button) {
        display: none;
      }

      .recommender-inner > div:nth-child(3) {
        display: none;
      }

      .recommender-inner > div[aria-hidden="true"] {
        display: none;
      }

      /* Fixed desktop shortcut navigation */

            <script>
              (() => {
                const button = document.getElementById("recommend-button");
                const resetButton = document.getElementById("reset-recommendation-button");
                const resultsEl = document.getElementById("recommendation-results");
                if (!button || !resultsEl) return;

                const selectIds = [
                  "rec-gpa",
                  "rec-school-tier",
                  "rec-topik",
                  "rec-english",
                  "rec-gaokao",
                  "rec-path",
                  "rec-major",
                  "rec-material",
                  "rec-type",
                  "rec-region",
                ];
                const defaults = Object.fromEntries(
                  selectIds.map((id) => {
                    const field = document.getElementById(id);
                    return [id, field ? field.value : ""];
                  })
                );

                function readEmbeddedUniversities() {
                  if (Array.isArray(window.recommendationUniversities) && window.recommendationUniversities.length) {
                    return window.recommendationUniversities;
                  }
                  return [];
                }

                const universitiesForRecommendation = readEmbeddedUniversities();
                function hasAdmissionData(school) {
                  const summary = window.admissionCaseSummaries?.[school.slug];
                  return !!summary && Number(summary.caseCount || 0) > 0;
                }
                const categoryLabels = {
                  stable: "较有希望",
                  match: "适合申请",
                  reach: "冲刺申请",
                  prepare_first: "先补条件",
                  verify: "需确认",
                };
                const majorKeywords = {
                  business: ["经营", "商科", "经济", "国际", "创业", "房地产"],
                  "computer-science": ["计算机", "AI", "IT", "半导体", "机器人", "软件"],
                  engineering: ["工科", "工程", "电子", "航空", "造船", "产业"],
                  media: ["传媒", "影视", "电影", "表演", "内容"],
                  "art-design": ["艺术", "设计", "美术", "动画", "建筑"],
                  "korean-language": ["韩语", "教育", "外语", "通翻译"],
                  tourism: ["酒店", "旅游", "航空", "服务"],
                  humanities: ["人文", "外语", "国际", "地域", "社会"],
                  science: ["自然", "生命", "科学", "医学", "保健", "药学", "农"],
                };

                function safeHtml(value) {
                  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;",
                  }[char]));
                }

                function fieldValue(id) {
                  const field = document.getElementById(id);
                  return field ? field.value : "";
                }

                function tierRank(school) {
                  if (school.no <= 17) return 1;
                  if (school.no <= 30) return 2;
                  if (school.no <= 50) return 3;
                  if (school.no <= 75) return 4;
                  return 5;
                }

                function targetGpa(school) {
                  if (school.no <= 10) return 88;
                  if (school.no <= 17) return 84;
                  if (school.no <= 30) return 78;
                  if (school.no <= 50) return 74;
                  if (school.no <= 75) return 70;
                  return 66;
                }

                function categoryFrom(score, school) {
                  const rank = tierRank(school);
                  if (score >= 84) return rank <= 2 ? "match" : "stable";
                  if (score >= 72) return "match";
                  if (score >= 60) return "reach";
                  if (score >= 48) return "prepare_first";
                  return "verify";
                }

                function majorMatches(school, major) {
                  if (major === "undecided") return true;
                  const text = `${school.focus || ""} ${school.nameCn || ""}`;
                  return (majorKeywords[major] || []).some((keyword) => text.includes(keyword));
                }

                function scoreSchool(school) {
                  const gpa = Number(fieldValue("rec-gpa")) || 0;
                  const schoolTier = fieldValue("rec-school-tier");
                  const topik = Number(fieldValue("rec-topik")) || 0;
                  const english = fieldValue("rec-english");
                  const gaokao = fieldValue("rec-gaokao");
                  const path = fieldValue("rec-path");
                  const major = fieldValue("rec-major");
                  const material = fieldValue("rec-material");

                  let score = 62 + (gpa - targetGpa(school)) * 1.25;
                  if (schoolTier === "provincial_key") score += 7;
                  if (schoolTier === "city_key") score += 4;
                  if (schoolTier === "vocational") score -= 4;
                  if (gaokao === "high") score += 7;
                  if (gaokao === "above_tier_one") score += 5;
                  if (gaokao === "submitted") score += 2;
                  if (topik >= 5) score += 8;
                  else if (topik === 4) score += 5;
                  else if (topik === 3) score += 1;
                  else score -= 8;
                  if (["ielts60", "ielts65", "toefl80"].includes(english)) score += 3;
                  if (majorMatches(school, major)) score += 8;
                  else if (major !== "undecided") score -= 6;
                  if (material === "portfolio" && /艺术|设计|美术|传媒|影视|动画/.test(String(school.focus || ""))) score += 7;
                  if (material === "matched") score += 4;
                  if (material === "none") score -= 5;
                  if (path === "language" && topik <= 3) score += 5;
                  if (path === "direct" && topik >= 4) score += 4;

                  const reasons = [];
                  reasons.push(majorMatches(school, major) ? "专业方向与学校强项较匹配" : "专业方向可作为备选确认");
                  reasons.push(gpa >= targetGpa(school) ? "高中均分达到该梯队参考线" : "均分略低，建议搭配保底校");
                  reasons.push(topik >= 4 ? "TOPIK条件适合直申参考" : "韩语等级需要继续补强");

                  const cautions = [];
                  if (tierRank(school) <= 2) cautions.push("名校竞争强，需要确认当年招生简章");
                  if (material === "none") cautions.push("专业材料不足时，录取把握会下降");
                  if (topik <= 3) cautions.push("建议同步准备语言学院或补交计划");
                  if (!cautions.length) cautions.push("注意申请批次、材料截止日和面试要求");

                  return {
                    school,
                    score,
                    rank: tierRank(school),
                    category: categoryFrom(score, school),
                    reasons,
                    cautions,
                  };
                }

                function filteredSchools() {
                  const type = fieldValue("rec-type");
                  const region = fieldValue("rec-region");
                  return universitiesForRecommendation.filter((school) => {
                    if (!hasAdmissionData(school)) return false;
                    const schoolType = String(school.type || "");
                    const city = String(school.city || "");
                    if (type === "national" && !/国立|公立/.test(schoolType)) return false;
                    if (type === "private" && !schoolType.includes("私立")) return false;
                    if (region === "seoul" && !city.includes("首尔")) return false;
                    if (region === "regional" && city.includes("首尔")) return false;
                    return true;
                  });
                }

                function chooseRecommendations() {
                  const scored = filteredSchools()
                    .map(scoreSchool)
                    .sort((a, b) => b.score - a.score || a.school.no - b.school.no);
                  const picked = [];
                  const used = new Set();
                  const desiredCategories = ["stable", "match", "match", "reach", "stable"];

                  for (const category of desiredCategories) {
                    const item = scored.find((candidate) => !used.has(candidate.school.slug) && candidate.category === category);
                    if (!item) continue;
                    picked.push(item);
                    used.add(item.school.slug);
                  }
                  for (const item of scored) {
                    if (picked.length >= 5) break;
                    if (used.has(item.school.slug)) continue;
                    picked.push(item);
                    used.add(item.school.slug);
                  }

                  return picked
                    .slice(0, 5)
                    .sort((a, b) => b.rank - a.rank || b.score - a.score || a.school.no - b.school.no);
                }

                function casePanel(slug) {
                  const summary = window.admissionCaseSummaries?.[slug];
                  if (!summary) {
                    return '<div class="recommendation-case-panel"><p class="recommendation-result-note">暂无公开案例摘要，建议以学校最新招生简章为准。</p></div>';
                  }
                  const admitted = summary.admittedCount || summary.acceptedCount || 0;
                  const rejected = summary.rejectedCount || 0;
                  const avg = summary.admittedAverageGpa ? `${summary.admittedAverageGpa}分` : "待整理";
                  const topikItems = Array.isArray(summary.topikDistribution) ? summary.topikDistribution.slice(0, 2).map((item) => item.label).join("、") : "待整理";
                  return `
                    <div class="recommendation-case-panel">
                      <div class="case-field"><strong>公开案例</strong><span><span class="case-count-value">${safeHtml(admitted)}</span> 个录取案例 / ${safeHtml(rejected)} 个拒录案例</span></div>
                      <div class="case-field"><strong>参考均分</strong><span>${safeHtml(avg)}</span></div>
                      <div class="case-field"><strong>TOPIK分布</strong><span>${safeHtml(topikItems)}</span></div>
                      <p class="recommendation-result-note">案例样本只用于初步画像，不等于学校官方录取概率。</p>
                    </div>
                  `;
                }

                function renderRecommendations() {
                  if (!universitiesForRecommendation.length) {
                    resultsEl.innerHTML = '<h2>初步推荐结果</h2><article class="recommendation-card"><span class="recommendation-index">!</span><div class="recommendation-body"><p>推荐数据读取失败，请刷新页面后再试。</p></div></article>';
                    resultsEl.classList.add("is-visible");
                    return;
                  }

                  const recommendations = chooseRecommendations();
                  resultsEl.innerHTML = `
                    <h2>初步推荐结果</h2>
                    ${recommendations.map((item, index) => {
                      const school = item.school;
                      const confidence = categoryLabels[item.category] || "适合申请";
                      return `
                        <article class="recommendation-card">
                          <span class="recommendation-index">${index + 1}</span>
                          <div class="recommendation-body">
                            <div class="recommendation-head">
                              <h3>
                                <button class="recommendation-school-toggle" type="button" aria-expanded="false" data-school-slug="${safeHtml(school.slug)}">
                                  ${safeHtml(school.nameCn)}<span class="recommendation-school-arrow">↗</span>
                                </button>
                                <span class="recommendation-rank">T${item.rank}</span>
                                <span class="recommendation-meta-inline">${safeHtml(school.city)} / ${safeHtml(school.type)} · <span class="recommendation-confidence">${safeHtml(confidence)}</span></span>
                              </h3>
                            </div>
                            <p><strong>专业方向匹配：</strong><span>${safeHtml(school.focus || "综合类专业")}</span></p>
                            <p><strong>推荐理由：</strong><span>${safeHtml(item.reasons.join("；"))}</span></p>
                            <p><strong>申请提醒：</strong><span>${safeHtml(item.cautions.join("；"))}</span></p>
                            <p class="recommendation-result-note">公开案例存在样本偏差，只适合做申请画像参考，不等于学校官方录取概率。</p>
                          </div>
                        </article>
                      `;
                    }).join("")}
                  `;
                  resultsEl.classList.add("is-visible");
                  resultsEl.querySelectorAll(".recommendation-school-toggle").forEach((toggle) => {
                    toggle.addEventListener("click", () => {
                      const expanded = toggle.getAttribute("aria-expanded") === "true";
                      const body = toggle.closest(".recommendation-body");
                      body.querySelector(".recommendation-case-panel")?.remove();
                      toggle.setAttribute("aria-expanded", String(!expanded));
                      if (!expanded) body.insertAdjacentHTML("beforeend", casePanel(toggle.dataset.schoolSlug));
                    });
                  });
                }

                button.addEventListener("click", renderRecommendations);
                resetButton?.addEventListener("click", () => {
                  Object.entries(defaults).forEach(([id, value]) => {
                    const field = document.getElementById(id);
                    if (field) field.value = value;
                  });
                  resultsEl.innerHTML = "";
                  resultsEl.classList.remove("is-visible");
                });
              })();
            </script>
            <script id="restored-ai-case-recommender">
              (() => {
                const button = document.getElementById("recommend-button");
                const resetButton = document.getElementById("reset-recommendation-button");
                const resultsEl = document.getElementById("recommendation-results");
                if (!button || !resultsEl) return;

                function htmlEscape(value) {
                  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;",
                  }[char]));
                }

                function readEmbeddedUniversities() {
                  if (Array.isArray(window.recommendationUniversities) && window.recommendationUniversities.length) {
                    return window.recommendationUniversities;
                  }
                  return [];
                }

                const universities = readEmbeddedUniversities().map((school) => ({
                  ...school,
                  name: school.nameCn || school.name || school.nameEn || "",
                }));
                const RECOMMENDATION_LIMIT = 5;
                const universityBySlug = new Map(universities.map((school) => [school.slug, school]));
                const tierNotes = {
                  "seoul-national-university": "T1",

                function tierFor(school) {
                  if (tierNotes[school.slug]) return tierNotes[school.slug];

                  if (school.no <= 30) return "T2";
                  if (school.no <= 50) return "T3";
                  if (school.no <= 75) return "T4";
                  return "T5";
                }

                function schoolTierRank(school) {
                  return Number(String(tierFor(school)).replace("T", "")) || 4;
                }

                function isDefaultApplicant(applicant) {
                  return applicant.gpa === 77 &&
                    applicant.schoolTier === "regular" &&
                    applicant.gaokao === "not_submitted" &&

                    applicant.major === "undecided" &&
                    applicant.material === "matched" &&
                    applicant.region === "any" &&
                    applicant.type === "any";
                }

                function majorScore(school, applicant) {
                  if (applicant.major === "undecided") return 4;
                  const focus = String(school.focus || "");
                  const keywords = majorKeywords[applicant.major] || [];
                  return keywords.some((keyword) => focus.includes(keyword)) ? 10 : -5;

                function summaryFor(slug) {
                  return window.admissionCaseSummaries?.[slug] || null;

                  return summary?.admittedAverageGpa ? Math.round(summary.admittedAverageGpa) : fallback;

                function categoryFor(score, school, applicant) {
                  const tier = tierFor(school);
                  const minTopik = tierTopikMinimum[tier] || 3;
                  if (applicant.topik < minTopik) return "先补条件";
                  if (score >= 82) return "较有希望";
                  if (score >= 70) return "适合申请";
                  if (score >= 58) return "冲刺申请";
                  return "先补条件";

                function detailFor(school, applicant, category) {
                  const summary = summaryFor(school.slug);
                  const explicit = schoolDetails[school.slug];
                  if (explicit) return explicit;
                  const sampleText = summary?.caseCount ? `${summary.caseCount}个公开案例` : "公开案例样本有限";
                  const gpaText = summary?.admittedAverageGpa ? `录取均分约${Math.round(summary.admittedAverageGpa)}/100` : "均分需结合简章确认";
                  const topikText = topSignal(summary?.topikDistribution);
                  return {
                    caseReason: `${sampleText}，${gpaText}，常见语言段为${topikText}。`,
                    caseSummary: `${school.name}案例方向偏${school.focus || "综合学科"}，可结合高中背景和专业材料判断。`,
                    caution: category === "先补条件" ? "当前条件需要先补强语言或专业材料，再作为正式申请候选。" : "建议同步确认最新招生简章、面试要求和材料截止日。",

                function enrichSchool(school, applicant, forcedCategory) {
                  const tier = tierFor(school);
                  const summary = summaryFor(school.slug);
                  const target = averageGpaFromSummary(summary, tierTarget[tier] || 74);
                  let score = 70 + (applicant.gpa - target) * 1.3;
                  score += schoolTierBonus[applicant.schoolTier] || 0;
                  score += gaokaoBonus[applicant.gaokao] || 0;
                  score += Math.min(applicant.topik, 6) * 2;
                  score += majorScore(school, applicant);
                  if (applicant.material === "matched") score += 4;
                  if (applicant.material === "portfolio" && /艺术|设计|美术|传媒|影视|动画/.test(String(school.focus || ""))) score += 8;
                  if (applicant.material === "none") score -= 5;
                  const category = forcedCategory || categoryFor(score, school, applicant);
                  const detail = detailFor(school, applicant, category);
                  return {
                    ...school,
                    name: school.name || school.nameCn || school.nameEn,
                    category,
                    score,
                    fit: Math.abs(applicant.gpa - target) + Math.abs((applicant.topik || 0) - (tierTopikMinimum[tier] || 3)) * 5,
                    caseReason: detail.caseReason,
                    caseSummary: detail.caseSummary,
                    caution: detail.caution,
                  };

                function buildBalancedSlate(results) {
                  const selected = [];
                  const used = new Set();
                  const slots = Object.entries(recommendationSlatePlan).flatMap(([category, plan]) =>
                    Array.from({ length: plan.count }, () => category)
                  );

                  slots.forEach((slot) => {
                    const label = recommendationSlatePlan[slot].label;
                    const picked = results.find((school) => !used.has(school.slug) && school.category === label) ||
                      results.find((school) => !used.has(school.slug));
                    if (!picked) return;
                    used.add(picked.slug);
                    selected.push({ ...picked, category: label });
                  });

                  return selected.slice(0, RECOMMENDATION_LIMIT);

                        displayIndex: defaultVisualOrder[school.slug],
                        visualOrder: defaultVisualOrder[school.slug],

                      .sort((a, b) => a.visualOrder - b.visualOrder);

                  const filtered = universities
                    .filter(hasAdmissionData)

                      if (applicant.type === "national") return /国立|公立/.test(String(school.type || ""));

                    .map((school) => enrichSchool(school, applicant))
                    .sort((a, b) => a.fit - b.fit || b.score - a.score || schoolTierRank(b) - schoolTierRank(a));

                  return buildBalancedSlate(filtered)
                    .sort((a, b) => schoolTierRank(b) - schoolTierRank(a) || b.score - a.score)

    <script id="home-banner-viewer">
      (() => {
        const bannerImages = Array.from(document.querySelectorAll("[data-banner-image]"));
        const bannerDots = Array.from(document.querySelectorAll("[data-banner-dot]"));
        const bannerButton = document.querySelector("[data-banner-open]");
        const viewer = document.querySelector("[data-image-viewer]");
        const viewerStage = document.querySelector("[data-viewer-stage]");
        const viewerImage = document.querySelector("[data-viewer-image]");
        const closeButton = document.querySelector("[data-viewer-close]");

        if (!bannerImages.length || !bannerButton || !viewer || !viewerStage || !viewerImage || !closeButton) return;

        let activeIndex = 0;
        let zoom = 1;
        let panX = 0;
        let panY = 0;
        let dragStartX = 0;
        let dragStartY = 0;
        let dragBaseX = 0;
        let dragBaseY = 0;
        let isDragging = false;

        const renderBanner = () => {
          bannerImages.forEach((image, index) => image.classList.toggle("is-active", index === activeIndex));
          bannerDots.forEach((dot, index) => dot.classList.toggle("is-active", index === activeIndex));
        };

        const setViewerTransform = () => {
          viewerImage.style.setProperty("--zoom", zoom.toFixed(3));
          viewerImage.style.setProperty("--pan-x", `${panX}px`);
          viewerImage.style.setProperty("--pan-y", `${panY}px`);
        };

        const resetViewerTransform = () => {
          zoom = 1;
          panX = 0;
          panY = 0;
          setViewerTransform();
        };

        const openViewer = () => {
          const source = bannerImages[activeIndex];
          viewerImage.src = source.currentSrc || source.src;
          viewerImage.alt = source.alt || "";
          resetViewerTransform();
          viewer.classList.add("is-open");
          viewer.setAttribute("aria-hidden", "false");
          document.body.style.overflow = "hidden";
        };

        const closeViewer = () => {
          viewer.classList.remove("is-open");
          viewer.setAttribute("aria-hidden", "true");
          document.body.style.overflow = "";
          isDragging = false;
          viewerStage.classList.remove("is-dragging");
        };

        window.setInterval(() => {
          activeIndex = (activeIndex + 1) % bannerImages.length;
          renderBanner();
        }, 5000);

        bannerButton.addEventListener("click", openViewer);
        closeButton.addEventListener("click", closeViewer);
        viewer.addEventListener("click", (event) => {
          if (event.target === viewer) closeViewer();
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && viewer.classList.contains("is-open")) closeViewer();
        });

        viewerStage.addEventListener("wheel", (event) => {
          event.preventDefault();
          const direction = event.deltaY > 0 ? -1 : 1;
          const nextZoom = Math.min(4, Math.max(0.45, zoom + direction * 0.12));
          zoom = nextZoom;
          setViewerTransform();
        }, { passive: false });

        viewerStage.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          isDragging = true;
          dragStartX = event.clientX;
          dragStartY = event.clientY;
          dragBaseX = panX;
          dragBaseY = panY;
          viewerStage.classList.add("is-dragging");
          viewerStage.setPointerCapture(event.pointerId);
        });

        viewerStage.addEventListener("pointermove", (event) => {
          if (!isDragging) return;
          panX = dragBaseX + event.clientX - dragStartX;
          panY = dragBaseY + event.clientY - dragStartY;
          setViewerTransform();
        });

        const stopDragging = (event) => {
          if (!isDragging) return;
          isDragging = false;
          viewerStage.classList.remove("is-dragging");
          if (viewerStage.hasPointerCapture(event.pointerId)) {
            viewerStage.releasePointerCapture(event.pointerId);
          }
        };

        viewerStage.addEventListener("pointerup", stopDragging);
        viewerStage.addEventListener("pointercancel", stopDragging);
      })();
    </script>
    <script id="thin-border-renderer">
      (() => {
        const THIN_BORDER = "0.3px";
        const sideShadow = {
          top: (color) => `inset 0 ${THIN_BORDER} 0 0 ${color}`,
          right: (color) => `inset -${THIN_BORDER} 0 0 0 ${color}`,
          bottom: (color) => `inset 0 -${THIN_BORDER} 0 0 ${color}`,
          left: (color) => `inset ${THIN_BORDER} 0 0 0 ${color}`
        };
        const sides = ["top", "right", "bottom", "left"];
        const cssSide = { top: "Top", right: "Right", bottom: "Bottom", left: "Left" };
        const isVisibleColor = (color) => color && color !== "transparent" && color !== "rgba(0, 0, 0, 0)";
        const isSameColor = (items) => items.every((item) => item.color === items[0].color);

        const renderThinBorders = () => {
          document.querySelectorAll("body *").forEach((el) => {
            if (el.closest("svg") && el.tagName.toLowerCase() !== "svg") return;

            if (el.dataset.thinBorderApplied === "true") {
              el.style.borderColor = "";
              el.style.boxShadow = el.dataset.thinBorderBaseShadow || "";
            }

            const computed = getComputedStyle(el);
            const activeSides = sides
              .map((side) => {
                const key = cssSide[side];
                return {
                  side,
                  width: parseFloat(computed[`border${key}Width`]),
                  style: computed[`border${key}Style`],
                  color: computed[`border${key}Color`]
                };
              })
              .filter((item) => item.width > 0 && item.style !== "none" && isVisibleColor(item.color));

            if (!activeSides.length) return;

            const rawShadow = computed.boxShadow === "none" ? "" : computed.boxShadow;
            const baseShadow = rawShadow.includes("inset") ? "" : rawShadow;
            const borderLayers = activeSides.length === 4 && isSameColor(activeSides)
              ? [`inset 0 0 0 ${THIN_BORDER} ${activeSides[0].color}`]
              : activeSides.map((item) => sideShadow[item.side](item.color));

            el.dataset.thinBorderApplied = "true";
            el.dataset.thinBorderBaseShadow = baseShadow;
            el.style.borderColor = "transparent";
            el.style.boxShadow = [baseShadow, ...borderLayers].filter(Boolean).join(", ");
          });
        };

        let thinBorderFrame = 0;
        const scheduleThinBorders = () => {
          cancelAnimationFrame(thinBorderFrame);
          thinBorderFrame = requestAnimationFrame(renderThinBorders);
        };

        scheduleThinBorders();
        window.addEventListener("load", scheduleThinBorders);
        ["click", "change", "input"].forEach((eventName) => {
          document.addEventListener(eventName, scheduleThinBorders, true);
        });
      })();
    </script>
