<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>韩学罗盘</title>
    <style>
      :root {
        --paper: #fbfbf8;
        --ink: #0a0a0a;
        --yellow: #ffe07a;
        --mint: #a4d4c5;
        --pink: #ffd0d8;
        --green: #71d39b;
        --lavender: #b8a4ed;
        --peach: #ffb084;
        --coral: #ff6b5a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family:
          "Microsoft YaHei UI", "Microsoft YaHei", "微软雅黑", "PingFang SC", "Noto Sans CJK SC",
          "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, "MS Gothic", "Malgun Gothic", Inter,
          system-ui, -apple-system, sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }

      .site-header {
        position: relative;
        z-index: 10;
        padding: 1rem 2rem;
      }

      .header-inner {
        display: flex;
        min-height: 5rem;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .logo {
        display: block;
        width: 5rem;
        height: 5rem;
        object-fit: contain;
      }

      .top-nav {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .nav-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 0.5rem 1rem;
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1;
        transition: background-color 150ms ease;
      }

      .nav-pill:hover,
      .nav-pill:focus,
      .nav-pill:active {
        background: var(--paper);
        outline: none;
      }

      .nav-yellow {
        background: var(--yellow);
      }

      .nav-mint {
        background: var(--mint);
      }

      .nav-pink {
        background: var(--pink);
      }

      .recommender {
        border-top: 1px solid var(--ink);
        border-bottom: 0;
        padding: 4.1rem 2rem 2rem;
      }

      .recommender-inner {
        display: block;
        max-width: 92rem;
        margin: 0 auto;
      }

      .recommender-kicker {
        display: inline-flex;
        border: 1px solid var(--ink);
        border-radius: 999px;
        background: var(--mint);
        padding: 0.35rem 0.7rem;
        font-size: 0.78rem;
        font-weight: 900;
      }

      .recommender-title {
        max-width: 14ch;
        margin: 0.75rem 0 0;
        font-size: clamp(2.25rem, 4.5vw, 4.5rem);
        font-weight: 900;
        line-height: 0.95;
        letter-spacing: 0;
      }

      .recommender-copy {
        max-width: 58ch;
        margin: 1rem 0 0;
        color: #6a6a6a;
        font-size: 1rem;
        line-height: 1.75;
      }

      .recommender-form {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        border: 1px solid var(--ink);
        background: #ffffff;
        padding: 1rem;
      }

      .recommender-form label {
        display: grid;
        gap: 0.3rem;
        font-size: 0.85rem;
        font-weight: 800;
      }

      .recommender-form input,
      .recommender-form select {
        width: 100%;
        border: 1px solid var(--ink);
        background: var(--paper);
        padding: 0.55rem 0.65rem;
        font: inherit;
      }

      .recommend-button {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        justify-content: center;
        margin-top: 0.9rem;
        border: 1px solid var(--ink);
        border-radius: 999px;
        background: var(--yellow);
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
        font-weight: 900;
        cursor: pointer;
      }

      .reset-button {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        border-radius: 999px;
        background: var(--green);
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
        font-weight: 900;
        cursor: pointer;
      }

      .recommend-action-row {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        margin-top: 0.9rem;
      }

      .recommend-action-row .recommend-button {
        margin-top: 0;
      }

      .recommender-note {
        margin: 0;
        color: #6a6a6a;
        font-size: 0.78rem;
        line-height: 1.6;
        margin-left: 0.6rem;
      }

      .recommendation-results {
        display: none;
        margin-top: 1.25rem;
      }

      .recommendation-results.is-visible {
        display: grid;
        gap: 0.75rem;
      }

      .recommendation-results h2 {
        margin: 0;
        font-size: 1.15rem;
        line-height: 1.2;
      }

      .recommendation-card {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        border: 1px solid var(--ink);
        background: #ffffff;
        padding: 0.9rem;
      }

      .recommendation-index {
        display: inline-flex;
        width: 1.6rem;
        height: 1.6rem;
        flex: 0 0 1.6rem;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--ink);
        color: #ffffff;
        font-size: 0.78rem;
        font-weight: 900;
        line-height: 1;
        margin-top: 0.05rem;
      }

      .recommendation-body {
        min-width: 0;
        flex: 1;
      }

      .recommendation-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
      }

      .recommendation-card h3 {
        margin: 0;
        font-size: 1rem;
      }

      .recommendation-rank {
        margin-left: 0.35rem;
        color: var(--muted);
        font-size: 0.82em;
        font-style: italic;
        font-weight: 400;
      }

      .recommendation-card p {
        margin: 0.45rem 0 0;
        color: #6a6a6a;
        font-size: 0.78rem;
        line-height: 1.65;
      }

      .recommendation-score {
        color: #173a6a;
        font-weight: 700;
      }

      .result-badge {
        flex-shrink: 0;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 0.2rem 0.45rem;
        font-size: 0.68rem;
        font-weight: 900;
      }

      .recommender-form:not(.recommender-form-live),
      .recommend-button:not(#recommend-button) {
        display: none;
      }

      .recommender-inner > div:nth-child(3) {
        display: none;
      }

      .recommender-inner > div[aria-hidden="true"] {
        display: none;
      }

      @media (max-width: 1100px) {
        .recommender-form {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      .entries {
        margin-top: 2.1rem;
        flex-shrink: 0;
      }

      .entries-list {
        border-top: 1px solid var(--ink);
      }

      .entry-shell {
        --entry-overlap: 1.12rem;
        --entry-lift-extra: 0.38rem;
        position: relative;
        z-index: 1;
        display: block;
        margin-bottom: calc(-1 * var(--entry-overlap));
        transform: translate3d(0, 0, 0);
        transition:
          transform 300ms ease,
          background-color 150ms ease;
      }

      .entry-shell:hover,
      .entry-shell:focus,
      .entry-shell:active,
      .entry-shell:focus-within {
        z-index: 50;
        transform: translate3d(0, calc(-1 * (var(--entry-overlap) + var(--entry-lift-extra))), 0);
      }

      .entry-row {
        position: relative;
        min-height: 4.05rem;
        overflow: visible;
        border-top: 1px solid var(--ink);
        border-bottom: 1px solid var(--ink);
        background: var(--paper);
        transition: background-color 150ms ease;
      }

      .entry-shell:nth-child(1):hover .entry-row {
        background: #ffc2df;
      }

      .entry-shell:nth-child(2):hover .entry-row {
        background: #d8c9ff;
      }

      .entry-shell:nth-child(3):hover .entry-row {
        background: #c8f1d7;
      }

      .entry-shell:nth-child(4):hover .entry-row {
        background: #ffe88d;
      }

      .entry-shell:nth-child(5):hover .entry-row {
        background: #b7e1d5;
      }

      .entry-shell:nth-child(6):hover .entry-row {
        background: #ff8b7e;
      }

      .entry-copy {
        display: flex;
        min-height: 4.05rem;
        width: max-content;
        min-width: 100%;
        align-items: flex-start;
        gap: 1.75rem;
        padding: 0.75rem 11rem 0.5rem 2rem;
      }

      .entry-title {
        margin: 0;
        white-space: nowrap;
        color: var(--ink);
        font-size: 2.48rem;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0;
      }

      .entry-title-note {
        font-size: 0.8em;
      }

      .entry-pill {
        display: inline-flex;
        flex-shrink: 0;
        align-items: center;
        gap: 0.35rem;
        margin-top: 0.375rem;
        border: 1px solid var(--ink);
        border-radius: 999px;
        background: var(--paper);
        padding: 0.375rem 0.75rem;
        font-size: 0.6rem;
        font-weight: 700;
        line-height: 1;
      }

      .footer {
        flex-shrink: 0;
        border-top: 1px solid var(--ink);
        background: var(--paper);
        padding: 1rem 2rem;
      }

      .footer-inner {
        display: flex;
        max-width: 92rem;
        margin: 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        font-size: 0.875rem;
      }

      @media (max-width: 720px) {
        .site-header {
          padding: 0.75rem 1rem;
        }

        .header-inner {
          min-height: 4rem;
        }

        .logo {
          width: 4rem;
          height: 4rem;
        }

        .top-nav {
          gap: 0.35rem;
        }

        .nav-pill {
          padding: 0.5rem 0.65rem;
          font-size: 0.9rem;
        }

        .recommender {
          padding: 1.25rem 1rem;
        }

        .recommender-inner,
        .recommender-form {
          grid-template-columns: 1fr;
        }

        .recommender-title {
          font-size: 2.35rem;
        }

        .entry-row,
        .entry-copy {
          min-height: 2.75rem;
        }

        .entry-copy {
          gap: 1rem;
          padding: 0.625rem 7rem 0.5rem 0.75rem;
        }

        .entry-title {
          font-size: 1.48rem;
        }

        .entry-pill {
          margin-top: 0.25rem;
          font-size: 0.53rem;
        }

        .footer {
          padding: 0.85rem 1rem;
        }

        .footer-inner {
          align-items: flex-start;
          flex-direction: column;
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="site-header">
        <div class="header-inner">
          <a href="./hanxue-luopan-home.html" aria-label="韩学罗盘">
            <img class="logo" src="./public/hanxue-luopan-logo.png" alt="韩学罗盘" />
          </a>
          <nav class="top-nav" aria-label="主导航">
            <a class="nav-pill nav-yellow" href="./exchange-rate.html">汇率</a>
            <a class="nav-pill nav-mint" href="./korea-overview.html">韩国概况</a>
            <a class="nav-pill nav-pink" href="./about.html">关于我们</a>
          </nav>
        </div>
      </header>

      <section class="recommender" aria-label="韩国大学推荐">
        <div class="recommender-inner">
          <div aria-hidden="true"></div>
          <div>
            <div class="recommender-form recommender-form-live" aria-label="推荐条件">
              <label>年龄<input id="rec-age" type="number" value="18" min="15" max="30" /></label>
              <label>高中均分<input id="rec-gpa" type="number" value="88" min="0" max="100" /></label>
              <label>
                高中类型
                <select id="rec-school-tier">
                  <option value="provincial_key">省重点</option>
                  <option value="city_key" selected>市重点</option>
                  <option value="regular">普通高中</option>
                  <option value="unknown">不确定</option>
                </select>
              </label>
              <label>
                年级排名
                <select id="rec-rank">
                  <option value="top_5">前5%</option>
                  <option value="top_10">前10%</option>
                  <option value="top_25" selected>前25%</option>
                  <option value="middle">中游</option>
                  <option value="unknown">不确定</option>
                </select>
              </label>
              <label>
                TOPIK等级
                <select id="rec-topik">
                  <option value="0">暂无</option>
                  <option value="1">1级</option>
                  <option value="2">2级</option>
                  <option value="3">3级</option>
                  <option value="4" selected>4级</option>
                  <option value="5">5级</option>
                  <option value="6">6级</option>
                </select>
              </label>
              <label>
                高考/统考资料
                <select id="rec-gaokao">
                  <option value="high">高分/强证明</option>
                  <option value="above_tier_one">一本线以上</option>
                  <option value="submitted">可提交</option>
                  <option value="not_submitted" selected>暂不提交</option>
                </select>
              </label>
              <label>
                希望专业
                <select id="rec-major">
                  <option value="undecided">还没确定</option>
                  <option value="business">经营/商科</option>
                  <option value="computer-science" selected>计算机/AI</option>
                  <option value="engineering">工科</option>
                  <option value="media">传媒/影视</option>
                  <option value="art-design">艺术/设计</option>
                  <option value="korean-language">韩语/教育</option>
                  <option value="tourism">酒店/旅游</option>
                  <option value="humanities">人文/外语</option>
                  <option value="science">自然科学/生命</option>
                </select>
              </label>
              <label>
                希望地区
                <select id="rec-region">
                  <option value="不限" selected>不限</option>
                  <option value="首尔">首尔</option>
                  <option value="釜山">釜山</option>
                  <option value="大田">大田</option>
                  <option value="大邱">大邱</option>
                  <option value="水原">水原</option>
                  <option value="济州">济州</option>
                </select>
              </label>
              <label>
                预算
                <select id="rec-budget">
                  <option value="low">尽量低</option>
                  <option value="medium" selected>中等</option>
                  <option value="high">较充足</option>
                </select>
              </label>
              <label>
                学校类型
                <select id="rec-type">
                  <option value="any" selected>不限</option>
                  <option value="national">国立/公立</option>
                  <option value="private">私立也可以</option>
                </select>
              </label>
            </div>
            <div class="recommend-action-row">
              <button class="recommend-button" id="recommend-button" type="button">生成5所推荐大学</button>
              <button class="reset-button" id="reset-recommendation-button" type="button">还原</button>
              <p class="recommender-note">
                推荐结果仅用于初步选校，不代表录取保证。请以学校最新招生简章为准。
              </p>
            </div>
            <div class="recommendation-results" id="recommendation-results" aria-live="polite"></div>
          </div>
          <div>
            <div class="recommender-form" aria-label="推荐条件">
              <label>年龄<input type="number" value="18" min="15" max="30" /></label>
              <label>高中均分<input type="number" value="88" min="0" max="100" /></label>
              <label>
                高中类型
                <select>
                  <option>省重点</option>
                  <option selected>市重点</option>
                  <option>普通高中</option>
                </select>
              </label>
              <label>
                年级排名
                <select>
                  <option>前5%</option>
                  <option>前10%</option>
                  <option selected>前25%</option>
                  <option>中游</option>
                </select>
              </label>
              <label>
                TOPIK等级
                <select>
                  <option>暂无</option>
                  <option>3级</option>
                  <option selected>4级</option>
                  <option>5级</option>
                  <option>6级</option>
                </select>
              </label>
              <label>
                希望专业
                <select>
                  <option>还没确定</option>
                  <option selected>计算机/AI</option>
                  <option>经营/商科</option>
                  <option>艺术/设计</option>
                  <option>传媒/影视</option>
                </select>
              </label>
            </div>
            <span class="recommend-button">生成5所推荐大学</span>
            <p class="recommender-note">
              推荐结果仅用于初步选校，不代表录取保证。请以学校最新招生简章为准。完整交互版会在本地 Next 页面中运行。
            </p>
          </div>
        </div>
      </section>

      <section class="entries" aria-label="信息入口">
        <div class="entries-list">
          <a class="entry-shell" href="./universities.html">
            <article class="entry-row">
              <div class="entry-copy">
                <h2 class="entry-title">韩国大学库</h2>
                <span class="entry-pill">50校比较 ↗</span>
              </div>
            </article>
          </a>
          <a class="entry-shell" href="./korean-learning.html">
            <article class="entry-row">
              <div class="entry-copy">
                <h2 class="entry-title">韩语学习</h2>
                <span class="entry-pill">零基础到6级 ↗</span>
              </div>
            </article>
          </a>
          <a class="entry-shell" href="./topik.html">
            <article class="entry-row">
              <div class="entry-copy">
                <h2 class="entry-title">TOPIK考试</h2>
                <span class="entry-pill">TOPIK路线 ↗</span>
              </div>
            </article>
          </a>
          <a class="entry-shell" href="./cost.html">
            <article class="entry-row">
              <div class="entry-copy">
                <h2 class="entry-title">留学费用<span class="entry-title-note">（奖学金）</span></h2>
                <span class="entry-pill">预算+奖学金 ↗</span>
              </div>
            </article>
          </a>
          <a class="entry-shell" href="./application.html">
            <article class="entry-row">
              <div class="entry-copy">
                <h2 class="entry-title">申请路线</h2>
                <span class="entry-pill">时间线+材料 ↗</span>
              </div>
            </article>
          </a>
          <a class="entry-shell" href="./agency-check.html">
            <article class="entry-row">
              <div class="entry-copy">
                <h2 class="entry-title">自申 vs 中介</h2>
                <span class="entry-pill">自申判断 ↗</span>
              </div>
            </article>
          </a>
        </div>
      </section>

      <footer class="footer">
        <div class="footer-inner">
          <span>韩学罗盘 © 2026</span>
          <span>官方优先 → 经验参考分离</span>
        </div>
      </footer>
      <script>
        (() => {
          const universities = [
            { slug: "seoul-national-university", name: "首尔大学", city: "首尔", type: "国立", focus: "综合研究、理工、人文社科", status: "verified", topikMinimum: 3, academicGate: 85, target: 94, caution: "85%只能当作入场券，首尔大还会综合看学校档次、年级排名、文书、活动和补充成绩。" },
            { slug: "sungkyunkwan-university", name: "成均馆大学", city: "首尔/水原", type: "私立", focus: "工科、经营、半导体、AI", status: "verified", topikMinimum: 4, target: 88, caution: "成绩扎实且TOPIK 4-5级的学生可重点考虑，但强势专业仍需要认真准备材料。" },
            { slug: "pusan-national-university", name: "釜山大学", city: "釜山", type: "国立", focus: "工科、自然科学、国立综合", status: "verified", topikMinimum: 3, target: 82, caution: "首尔以外国立大学中的强选项，预算敏感且专业匹配的学生可以重点考虑。" },
            { slug: "jeonbuk-national-university", name: "全北大学", city: "全州", type: "国立", focus: "农生命、工科、国立、人文", status: "verified", topikMinimum: 2, target: 68, tuition: "low", caution: "TOPIK 2可作为现实候选，但入学后通常要完成韩语补强课程，面试和学习计划书很重要。" },
            { slug: "pukyong-national-university", name: "釜庆大学", city: "釜山", type: "国立", focus: "海洋、水产、工程、国立", status: "verified", topikMinimum: 3, target: 70, tuition: "low", caution: "TOPIK 2学生还差一级，适合列为补到3级后的釜山国立候选。" },

            { slug: "korea-university", name: "高丽大学", city: "首尔", type: "私立", focus: "SKY、经营、传媒、政经", status: "partial", target: 91, caution: "TOP5-10层级比首尔大更现实一些，但仍要看具体学科规则。" },
            { slug: "hanyang-university", name: "汉阳大学", city: "首尔/ERICA", type: "私立", focus: "工科、创业、实用学科", status: "partial", target: 87, caution: "工科方向、成绩较好且TOPIK 4-5级的学生可以考虑，但必须核对当年学科要求。" },

          ];

          const rankingNotes = {
            "seoul-national-university": "第1名",
            "sungkyunkwan-university": "第4名",
            "pusan-national-university": "并列第15名",
            "jeonbuk-national-university": "并列第23名",
            "pukyong-national-university": "并列第30名",
            "kyungpook-national-university": "并列第15名",
            "chonnam-national-university": "并列第23名",
            "chungnam-national-university": "并列第27名",
            "chungbuk-national-university": "并列第27名",
            "kangwon-national-university": "并列第30名",
            "jeju-national-university": "并列第30名",
            "korea-maritime-ocean-university": "*",
            "dong-a-university": "*",
            "keimyung-university": "*",
            "wonkwang-university": "*",
            "kwangwoon-university": "*",
            "hankuk-university-of-foreign-studies": "*",
            "hongik-university": "*",
            "kyung-hee-university": "并列第8名",
            seoultech: "并列第30名",
            "yonsei-university": "第3名",
            "korea-university": "第6名",
            "hanyang-university": "并列第8名",
            "chung-ang-university": "并列第12名"
          };

          const majorKeywords = {
            business: ["经营", "商", "经济", "贸易", "政经"],
            "computer-science": ["IT", "AI", "计算机", "软件", "数据", "人工智能", "半导体"],
            engineering: ["工科", "工程", "电子", "机械", "半导体", "航空", "造船"],
            media: ["传媒", "电影", "影像", "广告", "内容", "表演"],
            "art-design": ["艺术", "设计", "美术", "动画", "建筑"],
            "korean-language": ["韩语", "韩国语", "人文", "教育", "外语"],
            tourism: ["旅游", "酒店"],
            humanities: ["人文", "外语", "国际", "教育", "文学", "历史"],
            science: ["自然", "科学", "生命", "医学", "农业"],
            undecided: []
          };

          const schoolTierBonus = { provincial_key: 4, city_key: 3, regular: 0, unknown: 1 };
          const rankBonus = { top_5: 5, top_10: 4, top_25: 2, middle: 0, unknown: 1 };
          const gaokaoBonus = { high: 5, above_tier_one: 4, submitted: 2, not_submitted: 0 };

          function value(id) {
            return document.getElementById(id).value;
          }

          function scoreMajor(focus, major) {
            if (major === "undecided") return 18;
            return Math.min(30, (majorKeywords[major] || []).filter((keyword) => focus.includes(keyword)).length * 12);
          }

          function scoreLanguage(topik, minimum) {
            if (!minimum) return topik >= 3 ? 14 : 8;
            if (topik >= minimum + 2) return 20;
            if (topik >= minimum + 1) return 18;
            if (topik >= minimum) return 15;
            if (topik + 1 === minimum) return 8;
            return 3;
          }

          function readinessPenalty({ academicGateBlocked, languageGateBlocked, adjustedAcademicGap, languageGap }) {
            let penalty = 0;
            if (academicGateBlocked) penalty += 60;
            if (languageGateBlocked) penalty += 35;
            if (adjustedAcademicGap < -18) penalty += 35;
            else if (adjustedAcademicGap < -12) penalty += 22;
            else if (adjustedAcademicGap < -8) penalty += 12;
            if (languageGap <= -2) penalty += 30;
            else if (languageGap === -1) penalty += 12;
            return penalty;
          }

          function fitPriority({ academicGateBlocked, languageGateBlocked, adjustedAcademicGap, languageGap }) {
            if (academicGateBlocked || languageGateBlocked || adjustedAcademicGap < -18 || languageGap <= -2) return 2;
            if (adjustedAcademicGap < -8 || languageGap < 0) return 1;
            return 0;
          }

          function recommend() {
            const applicant = {
              gpa: Number(value("rec-gpa")),
              schoolTier: value("rec-school-tier"),
              rank: value("rec-rank"),
              gaokao: value("rec-gaokao"),
              topik: Number(value("rec-topik")),
              major: value("rec-major"),
              region: value("rec-region"),
              budget: value("rec-budget"),
              type: value("rec-type")
            };

            const results = universities
              .filter((school) => {
                if (applicant.type === "national") return school.type.includes("国立") || school.type.includes("公立");
                if (applicant.type === "private") return school.type.includes("私立");
                return true;
              })
              .filter((school) => {
                if (applicant.budget !== "low") return true;
                return school.type.includes("国立") || school.type.includes("公立");
              })
              .map((school) => {
                const languageScore = scoreLanguage(applicant.topik, school.topikMinimum);
                const academicAdjusted =
                  applicant.gpa -
                  school.target +
                  schoolTierBonus[applicant.schoolTier] +
                  rankBonus[applicant.rank] +
                  gaokaoBonus[applicant.gaokao];
                const academicScore = academicAdjusted >= 8 ? 20 : academicAdjusted >= 3 ? 17 : academicAdjusted >= 0 ? 14 : academicAdjusted >= -5 ? 9 : 4;
                const academicGateBlocked = Boolean(school.academicGate && applicant.gpa < school.academicGate);
                const languageGap = school.topikMinimum ? applicant.topik - school.topikMinimum : applicant.topik >= 3 ? 0 : -1;
                const languageGateBlocked = Boolean(school.topikMinimum && applicant.topik < school.topikMinimum);
                const budgetScore =
                  applicant.budget === "high" || school.tuition === "low" || school.type.includes("国立")
                    ? 10
                    : school.tuition === "medium"
                      ? applicant.budget === "medium" ? 6 : 2
                      : applicant.budget === "medium" ? 7 : 3;
                const regionScore = applicant.region === "不限" || school.city.includes(applicant.region) ? 10 : 3;
                const typeScore =
                  applicant.type === "any" ||
                  (applicant.type === "national" && school.type.includes("国立")) ||
                  (applicant.type === "private" && school.type.includes("私立"))
                    ? 5
                    : 1;
                const reliabilityScore = school.status === "verified" ? 5 : 3;
                const rawScore =
                  scoreMajor(school.focus, applicant.major) +
                  languageScore +
                  academicScore +
                  budgetScore +
                  regionScore +
                  typeScore +
                  reliabilityScore;
                const fit = fitPriority({ academicGateBlocked, languageGateBlocked, adjustedAcademicGap: academicAdjusted, languageGap });
                const score = Math.max(
                  0,
                  rawScore - readinessPenalty({ academicGateBlocked, languageGateBlocked, adjustedAcademicGap: academicAdjusted, languageGap })
                );
                const hardGatePassed = !academicGateBlocked && !languageGateBlocked;
                const category = !hardGatePassed || fit === 2 ? "先补条件" : score >= 82 ? "较稳候选" : score >= 68 ? "适合考虑" : "冲刺候选";
                return { ...school, score, category, fit, academicAdjusted };
              })
              .sort((a, b) => {
                const fitCompare = a.fit - b.fit;
                if (fitCompare !== 0) return fitCompare;
                if (a.fit === 2) return b.academicAdjusted - a.academicAdjusted || b.score - a.score;
                return b.score - a.score;
              })
              .slice(0, 5);

            const target = document.getElementById("recommendation-results");
            target.classList.add("is-visible");
            target.innerHTML = `<h2>初步推荐结果</h2>${results
              .map(
                (school, index) => `<article class="recommendation-card">
                  <span class="recommendation-index" aria-label="推荐第${index + 1}位">${index + 1}</span>
                  <div class="recommendation-body">
                    <div class="recommendation-head">
                      <div>
                        <h3>${school.name}<span class="recommendation-rank">${rankingNotes[school.slug] || "*"}</span></h3>
                        <p>${school.city} · ${school.category} · <span class="recommendation-score">${school.score}分</span></p>
                      </div>
                      <span class="result-badge">${school.status}</span>
                    </div>
                    <p><strong>${school.city} / ${school.type}</strong> / 专业方向匹配：${school.focus}</p>
                    <p>${school.caution}</p>
                  </div>
                </article>`
              )
              .join("")}`;
          }

          function resetRecommendation() {
            const defaults = {
              "rec-age": "18",
              "rec-gpa": "88",
              "rec-school-tier": "city_key",
              "rec-rank": "top_25",
              "rec-topik": "4",
              "rec-gaokao": "not_submitted",
              "rec-major": "computer-science",
              "rec-region": "不限",
              "rec-budget": "medium",
              "rec-type": "any"
            };

            Object.entries(defaults).forEach(([id, defaultValue]) => {
              const field = document.getElementById(id);
              if (field) field.value = defaultValue;
            });

            const target = document.getElementById("recommendation-results");
            target.classList.remove("is-visible");
            target.innerHTML = "";
          }

          document.getElementById("recommend-button").addEventListener("click", recommend);
          document.getElementById("reset-recommendation-button").addEventListener("click", resetRecommendation);
        })();
      </script>
